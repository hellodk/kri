version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    labels: ["infra", "p3-low"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
    ignore:
      # celery/kombu don't support redis 8.x yet; block major redis bumps
      # until they do, otherwise the whole python group fails to resolve.
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    labels: ["infra", "p3-low"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    labels: ["infra", "p3-low"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
