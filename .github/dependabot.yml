version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    labels: ["infra", "p3-low"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    labels: ["infra", "p3-low"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    labels: ["infra", "p3-low"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
