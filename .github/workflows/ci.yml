name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  frontend-build:
    name: TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_DB: fleet_platform
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fleet:fleet@localhost:5432/fleet_platform
      TEST_DATABASE_URL: postgresql+psycopg://fleet:fleet@localhost:5432/fleet_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-minimum-32-chars-long
      FERNET_KEY: dGVzdC1rZXktbm90LWZvci1wcm9kdWN0aW9uLXVzZS1vbmx5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: PGPASSWORD=fleet psql -h localhost -U fleet -c "CREATE DATABASE fleet_test;" fleet_platform
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run pytest tests/unit/ -v --tb=short

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run ruff check fleet_platform/ tests/

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run mypy fleet_platform/ --ignore-missing-imports --no-error-summary

  security-scan:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run bandit -r fleet_platform/ -ll --skip B101 -q

  dead-code:
    name: Dead code (vulture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run vulture fleet_platform/ --min-confidence 80

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_DB: fleet_platform
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fleet:fleet@localhost:5432/fleet_platform
      TEST_DATABASE_URL: postgresql+psycopg://fleet:fleet@localhost:5432/fleet_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-minimum-32-chars-long
      FERNET_KEY: dGVzdC1rZXktbm90LWZvci1wcm9kdWN0aW9uLXVzZS1vbmx5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: PGPASSWORD=fleet psql -h localhost -U fleet -c "CREATE DATABASE fleet_test;" fleet_platform
      - run: pip install uv
      - run: uv sync --extra dev
      - run: |
          uv run pytest tests/unit/ \
            --cov=fleet_platform/services \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-fail-under=85 \
            -q
      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const cov = JSON.parse(fs.readFileSync('coverage.json'));
            const pct = cov.totals.percent_covered.toFixed(1);
            const icon = parseFloat(pct) >= 85 ? '✅' : '⚠️';
            const body = `## Coverage Report\n\n${icon} **${pct}%** on \`fleet_platform/services/\` (gate: 85%)\n\n${parseFloat(pct) >= 85 ? 'Gate passed' : 'Below gate — add tests before merging'}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install uv pip-audit
      - run: uv export --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
      - run: pip-audit -r /tmp/requirements.txt --progress-spinner off

  container-scan:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build API image
        run: docker build -f deploy/Dockerfile.api -t kri-api:ci .
      - name: Scan for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: kri-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
