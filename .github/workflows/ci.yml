name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  frontend-build:
    name: TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.26.4-pg17
        env:
          POSTGRES_DB: fleet_platform
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fleet:fleet@localhost:5432/fleet_platform
      TEST_DATABASE_URL: postgresql+psycopg://fleet:fleet@localhost:5432/fleet_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-minimum-32-chars-long
      FERNET_KEY: TJNUjlTWwn0v5n5raoMUYp-An_l3EnATE7xthpfAFGM=
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: PGPASSWORD=fleet psql -h localhost -U fleet -c "CREATE DATABASE fleet_test;" fleet_platform
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run pytest tests/unit/ -v --tb=short

  integration-tests:
    # tests/integration/ exercises the FastAPI app via httpx ASGITransport
    # against a real Postgres + a mocked Redis (see tests/integration/conftest.py).
    # Catches regressions that unit tests can't — JWT roundtrips, FK cascades,
    # request/response shape drift, dependency-injection wiring (#arch-ci).
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.26.4-pg17
        env:
          POSTGRES_DB: fleet_platform
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fleet:fleet@localhost:5432/fleet_platform
      TEST_DATABASE_URL: postgresql+psycopg://fleet:fleet@localhost:5432/fleet_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-minimum-32-chars-long
      FERNET_KEY: TJNUjlTWwn0v5n5raoMUYp-An_l3EnATE7xthpfAFGM=
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # The pgvector + pg_trgm extensions are CREATE EXTENSION IF NOT EXISTS'd
      # by tests/integration/conftest.py::test_engine, but the extensions
      # themselves must exist in the timescaledb image. They do (since pg17
      # ships pgvector via the timescale image), so we only need to create
      # the test database.
      - run: PGPASSWORD=fleet psql -h localhost -U fleet -c "CREATE DATABASE fleet_test;" fleet_platform
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run pytest tests/integration/ -v --tb=short

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run ruff check fleet_platform/ tests/

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run mypy fleet_platform/ --ignore-missing-imports --no-error-summary

  security-scan:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run bandit -r fleet_platform/ -ll --skip B101 -q

  dead-code:
    name: Dead code (vulture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run vulture fleet_platform/ --min-confidence 80

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    services:
      postgres:
        image: timescale/timescaledb:2.26.4-pg17
        env:
          POSTGRES_DB: fleet_platform
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fleet:fleet@localhost:5432/fleet_platform
      TEST_DATABASE_URL: postgresql+psycopg://fleet:fleet@localhost:5432/fleet_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-minimum-32-chars-long
      FERNET_KEY: TJNUjlTWwn0v5n5raoMUYp-An_l3EnATE7xthpfAFGM=
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: PGPASSWORD=fleet psql -h localhost -U fleet -c "CREATE DATABASE fleet_test;" fleet_platform
      - run: pip install uv
      - run: uv sync --extra dev
      # Coverage gate measures BOTH fleet_platform/services and
      # fleet_platform/agent. agent/ (planner, tools, guards, audit, executor,
      # loop) was previously excluded from measurement entirely (#799), so that
      # subsystem had no enforced coverage. It now carries the same 80% floor as
      # services/. Per-package floors are enforced below from coverage.json so a
      # regression in either package fails the gate independently.
      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/unit/ \
            --cov=fleet_platform/services \
            --cov=fleet_platform/agent \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            -q
      - name: Enforce per-package coverage floors
        run: |
          uv run python - <<'PY'
          import json, sys

          # Per-package coverage floors. Keep services at the established 80% bar;
          # agent/ joins at the same floor (#799). Raise a floor here once a
          # package is comfortably and durably above it.
          GATES = {
              "fleet_platform/services": 80.0,
              "fleet_platform/agent": 80.0,
          }
          files = json.load(open("coverage.json"))["files"]
          failed = False
          for pkg, floor in GATES.items():
              stmts = covered = 0
              for path, info in files.items():
                  norm = path.replace("\\", "/")
                  if norm == pkg or norm.startswith(pkg + "/"):
                      s = info["summary"]
                      stmts += s["num_statements"]
                      covered += s["covered_lines"]
              pct = (100.0 * covered / stmts) if stmts else 100.0
              status = "PASS" if pct >= floor else "FAIL"
              print(f"[{status}] {pkg}: {pct:.1f}% (floor {floor:.0f}%, {covered}/{stmts} stmts)")
              failed = failed or pct < floor
          sys.exit(1 if failed else 0)
          PY
      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const cov = JSON.parse(fs.readFileSync('coverage.json'));
            const pkgPct = (prefix) => {
              let stmts = 0, covered = 0;
              for (const [path, info] of Object.entries(cov.files)) {
                const norm = path.replace(/\\/g, '/');
                if (norm === prefix || norm.startsWith(prefix + '/')) {
                  stmts += info.summary.num_statements;
                  covered += info.summary.covered_lines;
                }
              }
              return stmts ? (100 * covered / stmts) : 100;
            };
            const row = (label, pct) => {
              const ok = pct >= 80;
              return `${ok ? '✅' : '⚠️'} \`${label}\` **${pct.toFixed(1)}%** (gate: 80%)`;
            };
            const svc = pkgPct('fleet_platform/services');
            const agt = pkgPct('fleet_platform/agent');
            const allOk = svc >= 80 && agt >= 80;
            const body = `## Coverage Report\n\n${row('fleet_platform/services/', svc)}\n\n${row('fleet_platform/agent/', agt)}\n\n${allOk ? 'Gate passed' : 'Below gate — add tests before merging'}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install uv pip-audit
      - run: uv export --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
      - run: pip-audit -r /tmp/requirements.txt --progress-spinner off

  container-scan:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    # secrets.* cannot be used in step `if:` — surface them as env first, then
    # the conditional login is a no-op when the Docker Hub creds are unset.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Build API image (with retry for transient pull timeouts)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: docker build -f deploy/Dockerfile.api -t kri-api:ci .
      - name: Scan for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kri-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  e2e-tests:
    # Playwright e2e tests run the full docker-compose stack (api + worker +
    # redis + db + frontend nginx). They take ~10 minutes wall-clock so we
    # gate them on PRs labeled `e2e` and on master pushes only — they're
    # not in the per-commit critical path (#arch-ci).
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    timeout-minutes: 25
    env:
      # docker-compose secrets — values are non-sensitive test fixtures.
      POSTGRES_PASSWORD: fleet
      REDIS_PASSWORD: ci-redis-password
      JWT_SECRET: ci-test-secret-minimum-32-chars-long
      FERNET_KEY: TJNUjlTWwn0v5n5raoMUYp-An_l3EnATE7xthpfAFGM=
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Materialize CI .env.docker
        # Generate a deterministic .env.docker from the secrets above so the
        # docker-compose stack can boot without depending on developer-only
        # files. See deploy/.env.docker.example for the full contract.
        run: |
          cat > .env.docker <<EOF
          DATABASE_URL=postgresql+psycopg://fleet:${POSTGRES_PASSWORD}@db:5432/fleet_demo
          TEST_DATABASE_URL=postgresql+psycopg://fleet:${POSTGRES_PASSWORD}@db:5432/fleet_test
          REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          REDIS_PASSWORD=${REDIS_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          JWT_ALGORITHM=HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
          JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
          FERNET_KEY=${FERNET_KEY}
          FRONTEND_ORIGIN=http://localhost
          ENVIRONMENT=test
          KRI_API_URL=http://api:8000
          PILLAR_DIR=/srv/salt/pillar
          EOF
      - name: Build + start stack
        # Retry the build/start: anonymous docker.io pulls of the base images
        # (library/nginx, library/python, library/node) intermittently fail the
        # whole job with `failed to authorize: ... EOF` under registry rate
        # limiting (#891). A short backoff between attempts clears the transient
        # auth/EOF without needing a registry mirror or Docker Hub credentials.
        run: |
          for attempt in 1 2 3; do
            if docker compose -f deploy/docker-compose.yml up -d --build api worker pg_backup redis db frontend; then
              echo "stack up (attempt $attempt)"; exit 0
            fi
            echo "::warning::stack build/start failed (attempt $attempt) — retrying after backoff"
            docker compose -f deploy/docker-compose.yml down -v || true
            sleep $((attempt * 20))
          done
          echo "::error::stack failed to build/start after 3 attempts"; exit 1
      - name: Wait for API health
        # /health is the lightweight probe the k8s manifests also use; the
        # worker queue takes longer to come up but the e2e tests don't
        # require it.
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost/api/v1/health >/dev/null; then
              echo "API is healthy"; exit 0
            fi
            sleep 2
          done
          echo "API failed to come up"; docker compose -f deploy/docker-compose.yml logs api | tail -100; exit 1
      - name: Run Playwright tests
        run: pnpm exec playwright test --reporter=line
        working-directory: .
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload stack logs on failure
        if: failure()
        run: |
          mkdir -p stack-logs
          docker compose -f deploy/docker-compose.yml logs > stack-logs/all.log 2>&1 || true
      - name: Upload stack logs artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stack-logs
          path: stack-logs/
          retention-days: 3
