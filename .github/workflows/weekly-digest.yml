name: Weekly digest

on:
  schedule:
    - cron: '0 8 * * 1'  # Monday 08:00 UTC
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="hellodk/kri"
          SINCE=$(date -d '7 days ago' --iso-8601 2>/dev/null || date -v-7d +%Y-%m-%d)

          MERGED=$(gh pr list --repo $REPO --state merged --search "merged:>=$SINCE" --json number --jq 'length')
          OPEN=$(gh issue list --repo $REPO --state open --json number --jq 'length')
          CLOSED=$(gh issue list --repo $REPO --state closed --search "closed:>=$SINCE" --json number --jq 'length')
          P0=$(gh issue list --repo $REPO --state open --label p0-critical --json number --jq 'length')
          P1=$(gh issue list --repo $REPO --state open --label p1-high --json number --jq 'length')

          echo "## kri Weekly Digest — $(date +%Y-%m-%d)"
          echo ""
          echo "| Metric | Value |"
          echo "|--------|-------|"
          echo "| PRs merged this week | $MERGED |"
          echo "| Issues closed this week | $CLOSED |"
          echo "| Total open issues | $OPEN |"
          echo "| P0 Critical open | $P0 |"
          echo "| P1 High open | $P1 |"
          echo ""
          echo "### Merged PRs"
          gh pr list --repo $REPO --state merged --search "merged:>=$SINCE" \
            --json number,title,author \
            --jq '.[] | "- #\(.number) \(.title) (@\(.author.login))"'
          echo ""
          echo "### Open P0/P1 Issues"
          gh issue list --repo $REPO --state open --label p0-critical,p1-high \
            --json number,title,labels \
            --jq '.[] | "- #\(.number) \(.title)"'
