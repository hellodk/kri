name: Weekly digest

on:
  schedule:
    - cron: '0 8 * * 1'  # Monday 08:00 UTC
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and post digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="hellodk/kri"
          SINCE=$(date -d '7 days ago' --iso-8601 2>/dev/null || date -v-7d +%Y-%m-%d)
          TODAY=$(date +%Y-%m-%d)

          MERGED=$(gh pr list --repo $REPO --state merged --search "merged:>=$SINCE" --json number --jq 'length')
          OPEN=$(gh issue list --repo $REPO --state open --json number --jq 'length')
          CLOSED=$(gh issue list --repo $REPO --state closed --search "closed:>=$SINCE" --json number --jq 'length')
          P0=$(gh issue list --repo $REPO --state open --label p0-critical --json number --jq 'length' 2>/dev/null || echo 0)
          P1=$(gh issue list --repo $REPO --state open --label p1-high --json number --jq 'length' 2>/dev/null || echo 0)

          BODY="## kri Weekly Digest — ${TODAY}

| Metric | Value |
|--------|-------|
| PRs merged this week | ${MERGED} |
| Issues closed this week | ${CLOSED} |
| Total open issues | ${OPEN} |
| P0 Critical open | ${P0} |
| P1 High open | ${P1} |

### Merged PRs
$(gh pr list --repo $REPO --state merged --search "merged:>=$SINCE" \
  --json number,title,author \
  --jq '.[] | "- #\(.number) \(.title) (@\(.author.login))"' 2>/dev/null || echo '_None_')

### Closed Issues
$(gh issue list --repo $REPO --state closed --search "closed:>=$SINCE" \
  --json number,title \
  --jq '.[] | "- #\(.number) \(.title)"' 2>/dev/null || echo '_None_')

_Auto-generated by weekly-digest workflow_"

          # Ensure label exists
          gh label create digest --color "0075ca" --description "Weekly digest report" --repo $REPO 2>/dev/null || true

          gh issue create \
            --repo $REPO \
            --title "Weekly Digest — ${TODAY}" \
            --body "$BODY" \
            --label digest
