name: Feature
description: New functionality or enhancement
labels: ["feature", "p2-normal"]
body:
  - type: markdown
    attributes:
      value: "## Feature Request"
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "List as checkboxes — these become your test scenarios"
      placeholder: |
        - [ ] Given X, when Y, then Z
        - [ ] Error state: given invalid input, show message
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests required
      description: "Unit / integration / E2E — what must be written before this closes"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Fleet / Nodes
        - Bootstrap
        - Drift detection
        - SBOM / Security
        - Salt integration
        - Playbooks / Ops
        - Groups / Secrets
        - iOS tracking
        - Auth / API
        - Infrastructure
        - Frontend / UI
    validations:
      required: true
