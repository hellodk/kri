# kri SonarQube project configuration
# Used by: sonar-scanner CLI or SonarQube CI plugin
#
# Run manually:
#   sonar-scanner \
#     -Dsonar.host.url=http://<sonarqube-url> \
#     -Dsonar.login=<token>

sonar.projectKey=kri-fleet-platform
sonar.projectName=kri Fleet Platform
sonar.projectVersion=${env.VERSION}

# Source roots
sonar.sources=fleet_platform,frontend/src
sonar.tests=tests,frontend/src

# Python
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.bandit.reportPaths=bandit-report.json

# TypeScript/JavaScript
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# Exclusions — don't scan generated/vendor files
sonar.exclusions=\
  **/__pycache__/**,\
  **/.venv/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/migrations/**,\
  **/*.min.js,\
  frontend/public/**

sonar.test.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**

# Security hotspot detection
sonar.security.hotspots.inheritanceMode=none
