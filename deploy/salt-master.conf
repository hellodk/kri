# kri Salt Master configuration
# Mounted into the salt-master container at /etc/salt/master.d/kri.conf

# Keys must be manually accepted via kri UI (Settings → Minion Keys)
auto_accept: False

# Pillar data per minion (ingest_url + node_token written by kri worker)
pillar_roots:
  base:
    - /srv/salt/pillar

# kri Salt states (grain_report, sbom_scan, etc.)
file_roots:
  base:
    - /srv/salt/states

# Listen on all interfaces so Tailscale-connected minions can reach us
interface: 0.0.0.0

# Log to stdout so docker compose logs captures it
log_file: /dev/stdout
log_level: info

# Presence detection — mark minions stale after 3 minutes
presence_events: True
loop_interval: 60

# Reactor: fire grain_report immediately when any minion starts/reconnects.
# This removes the dependency on the heartbeat window for online detection.
# Without this, a minion that reconnects stays "offline" in kri for up to
# 5 minutes (heartbeat interval) even though salt-master knows it's alive.
reactor:
  - 'salt/minion/*/start':
    - salt://reactor/grain_report_on_start.sls
