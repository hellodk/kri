# kri Salt Master configuration
# Mounted into the salt-master container at /etc/salt/master.d/kri.conf

# Keys must be manually accepted via kri UI (Settings → Minion Keys)
auto_accept: False

# Pillar data per minion (ingest_url + node_token written by kri worker)
pillar_roots:
  base:
    - /srv/salt/pillar

# kri Salt states (grain_report, sbom_scan, etc.)
file_roots:
  base:
    - /srv/salt/states

# Listen on all interfaces so Tailscale-connected minions can reach us
interface: 0.0.0.0

# Log to stdout so docker compose logs captures it
log_file: /dev/stdout
log_level: info

# Presence detection — mark minions stale after 3 minutes
presence_events: True
loop_interval: 60

# Reactor: fire grain_report immediately when any minion starts/reconnects.
# This removes the dependency on the heartbeat window for online detection.
# Without this, a minion that reconnects stays "offline" in kri for up to
# 5 minutes (heartbeat interval) even though salt-master knows it's alive.
reactor:
  - 'salt/minion/*/start':
    - salt://reactor/grain_report_on_start.sls

# Salt 3006+ disables all netapi clients by default. Enable exactly the clients
# kri uses so salt-api does not return "400 Client disabled".
netapi_enable_clients:
  - local
  - local_async
  - runner
  - wheel

# External auth for salt-api (kri workers authenticate as kri).
# IMPORTANT: The local-client function list below MUST stay in parity with
# _DEFAULT_SALT_FUNCTIONS in fleet_platform/services/platform_settings_svc.py.
# Any function added there must also be added here, or salt-api will deny it.
external_auth:
  pam:
    kri:
      # Local-client execution functions — mirrors _DEFAULT_SALT_FUNCTIONS
      - 'state.apply'
      - 'state.highstate'
      - 'state.show_sls'
      - 'pkg.install'
      - 'pkg.remove'
      - 'pkg.list_pkgs'
      - 'pkg.upgrade'
      - 'pip.install'
      - 'pip.installed'
      - 'pip.list'
      - 'service.start'
      - 'service.stop'
      - 'service.restart'
      - 'service.disable'
      - 'service.enable'
      - 'service.status'
      - 'service.get_all'
      - 'service.available'
      - 'service.enabled'
      - 'disk.usage'
      - 'disk.inodeusage'
      - 'status.loadavg'
      - 'status.meminfo'
      - 'grains.items'
      - 'grains.get'
      - 'test.ping'
      - 'test.version'
      - 'saltutil.sync_all'
      - 'saltutil.refresh_grains'
      - 'saltutil.refresh_pillar'
      - 'system.reboot'
      # cmd.run removed: grants arbitrary shell RCE on any minion (#758)
      - 'ps.list_processes'
      - 'ps.kill_pid'
      # Wheel client — minion key management
      - '@wheel':
        - 'key.list_all'
        - 'key.accept'
        - 'key.reject'
        - 'key.delete'
      # Runner client — fleet status queries
      - '@runner':
        - 'manage.up'
        - 'manage.versions'
        - 'manage.status'
