# docker-compose.override.yml — development overrides
# Run: docker compose -f docker-compose.yml -f docker-compose.override.yml up
services:
  api:
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn fleet_platform.api.main:app
             --host 0.0.0.0 --port 8000 --reload --log-level debug"
    ports:
      - "8000:8000"
    volumes:
      - ../fleet_platform:/app/fleet_platform
      - ../alembic.ini:/app/alembic.ini

  worker:
    volumes:
      - ../fleet_platform:/app/fleet_platform
      - salt-pillar:/srv/salt/pillar
      - ~/.ssh:/root/.ssh:ro

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend.dev
    ports:
      - "5173:5173"
