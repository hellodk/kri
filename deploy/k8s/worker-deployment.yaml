apiVersion: apps/v1
kind: Deployment
metadata:
  name: kri-worker
  namespace: kri
  labels:
    app: kri-worker
    component: worker
spec:
  # Two replicas for HA; HPA scales this up under load.
  replicas: 2
  selector:
    matchLabels:
      app: kri-worker
  template:
    metadata:
      labels:
        app: kri-worker
        component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: gitea.local/kri/kri-api:0.1.415
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - uv
            - run
            - celery
            - -A
            - fleet_platform.workers.celery_app
            - worker
            - --queues=default,maintenance,drift,sbom
            - --concurrency=4
            - --loglevel=info
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: JWT_SECRET
            - name: FERNET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: FERNET_SECRET_KEY
            - name: SALT_API_URL
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: SALT_API_URL
            - name: SALT_API_USER
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: SALT_API_USER
            - name: SALT_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: SALT_API_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+psycopg://fleet:$(POSTGRES_PASSWORD)@postgres.utilities.svc.cluster.local:5432/fleet_platform"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis.utilities.svc.cluster.local:6379/0"
            # Prevent Python from writing .pyc files to the read-only rootfs.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # Prevent uv from attempting a venv sync on the read-only rootfs.
            - name: UV_NO_SYNC
              value: "1"
          # The worker dispatches Salt commands via the HTTP API, but a small
          # number of housekeeping tasks (e.g. PKI key listing) still SSH to
          # the salt master. Mount the dedicated service-account keypair from
          # the kri-worker-ssh Secret. Mode 0600 mirrors how OpenSSH expects
          # private keys; defaultMode is octal 384 = 0600.
          volumeMounts:
            - name: ssh-key
              mountPath: /home/appuser/.ssh
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: uv-cache
              mountPath: /home/appuser/.cache
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "python3 -c 'from fleet_platform.workers.celery_app import celery_app; i=celery_app.control.inspect(timeout=3); r=i.ping(); exit(0 if r else 1)' 2>/dev/null"
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "python3 -c 'from fleet_platform.workers.celery_app import celery_app; s=celery_app.backend; exit(0)' 2>/dev/null"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
      volumes:
        - name: ssh-key
          secret:
            secretName: kri-worker-ssh
            defaultMode: 384  # 0600 — required by OpenSSH for private keys
            items:
              - key: id_ed25519
                path: id_ed25519
              - key: id_ed25519.pub
                path: id_ed25519.pub
              - key: known_hosts
                path: known_hosts
                mode: 420       # 0644 — known_hosts must be readable, not 0600
        - name: tmp
          emptyDir: {}
        - name: uv-cache
          emptyDir: {}
