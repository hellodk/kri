apiVersion: apps/v1
kind: Deployment
metadata:
  name: kri-api
  namespace: kri
  labels:
    app: kri-api
    component: api
spec:
  # Two replicas for HA; HPA scales this up under load.
  replicas: 2
  selector:
    matchLabels:
      app: kri-api
  template:
    metadata:
      labels:
        app: kri-api
        component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: gitea.local/kri/kri-api:0.1.415
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          command:
            - sh
            - -c
            - "bash /app/deploy/migrate.sh && uv run uvicorn fleet_platform.api.main:app --host 0.0.0.0 --port 8000 --log-level info"
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: JWT_SECRET
            - name: FERNET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: FERNET_SECRET_KEY
            - name: SALT_API_URL
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: SALT_API_URL
            - name: SALT_API_USER
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: SALT_API_USER
            - name: SALT_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: SALT_API_PASSWORD
            # Bearer token for /metrics scraping (#1050/#1051) — vmagent presents
            # it via the kri-metrics-token Secret (see observability/vm-agent.yaml).
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: METRICS_TOKEN
            - name: DATABASE_URL
              value: "postgresql+psycopg://fleet:$(POSTGRES_PASSWORD)@postgres.utilities.svc.cluster.local:5432/fleet_platform"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis.utilities.svc.cluster.local:6379/0"
            - name: LOG_LEVEL
              value: "info"
            # Prevent Python from writing .pyc files to the read-only rootfs.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # Prevent uv from attempting a venv sync on the read-only rootfs.
            - name: UV_NO_SYNC
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: uv-cache
              mountPath: /home/appuser/.cache
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: tmp
          emptyDir: {}
        - name: uv-cache
          emptyDir: {}
