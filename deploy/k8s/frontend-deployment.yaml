apiVersion: apps/v1
kind: Deployment
metadata:
  name: kri-frontend
  namespace: kri
  labels:
    app: kri-frontend
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kri-frontend
  template:
    metadata:
      labels:
        app: kri-frontend
        component: frontend
    spec:
      containers:
        - name: frontend
          image: gitea.local/kri/kri-frontend:0.1.415
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
