apiVersion: v1
kind: ConfigMap
metadata:
  name: kri-config
  namespace: kri
data:
  # Database — point at shared cluster postgres in utilities namespace
  DATABASE_URL: "postgresql+psycopg://fleet:$(POSTGRES_PASSWORD)@postgres.utilities.svc.cluster.local:5432/fleet_platform"
  # Redis — point at shared cluster redis in utilities namespace (or override via SealedSecret)
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@redis.utilities.svc.cluster.local:6379/0"
  # Application
  LOG_LEVEL: "info"
  APP_ENV: "production"
  ENVIRONMENT: "production"
  # RAG embedding server — seeds platform_settings on first start / after a DB
  # reset so the RAG config is retained instead of reverting to empty. A value
  # set via the Settings UI always takes precedence. Uncomment and point at your
  # OpenAI-compatible embedding endpoint.
  # LLM_EMBED_BASE_URL: "http://embed-host:8080"
  # LLM_INCLUDE_NODE_IPS: "true"
