# Dedicated worker for long-running ansible jobs (#579) — run_playbook,
# bootstrap_node, provision_master. Isolated from the control-plane worker so a
# burst of 2h jobs can't starve poll_salt_masters / presence / reapers / health.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kri-worker-ansible
  namespace: kri
  labels:
    app: kri-worker-ansible
    component: worker-ansible
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kri-worker-ansible
  template:
    metadata:
      labels:
        app: kri-worker-ansible
        component: worker-ansible
    spec:
      # Ansible playbook tasks have a 30 min soft / 35 min hard time limit
      # (fleet_platform/workers/celery_app.py: task_soft_time_limit=1800,
      # task_time_limit=2100). Default terminationGracePeriodSeconds is 30s,
      # which kills in-flight playbooks during a rolling deploy or eviction.
      # Set to 3700s (35 min hard limit + 100 s slack) so SIGTERM-then-graceful
      # Celery shutdown can complete before SIGKILL. preStop hook signals
      # Celery to stop accepting new tasks immediately, so the grace window
      # is used to drain rather than to start new work.
      terminationGracePeriodSeconds: 3700
      containers:
        - name: worker-ansible
          image: gitea.local/kri/kri-api:0.1.415
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - celery
            - -A
            - fleet_platform.workers.celery_app
            - worker
            - --queues=ansible
            - --concurrency=2
            - --loglevel=info
          # On pod termination: tell Celery to stop consuming new tasks but
          # finish in-flight ones. The main process's SIGTERM (from kubelet)
          # will then allow it to exit cleanly once tasks drain.
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "uv run celery -A fleet_platform.workers.celery_app control shutdown -d celery@$HOSTNAME || true"
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: JWT_SECRET
            - name: FERNET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: FERNET_SECRET_KEY
            - name: SALT_API_URL
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: SALT_API_URL
            - name: SALT_API_USER
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: SALT_API_USER
            - name: SALT_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: SALT_API_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+psycopg://fleet:$(POSTGRES_PASSWORD)@postgres.utilities.svc.cluster.local:5432/fleet_platform"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis.utilities.svc.cluster.local:6379/0"
          # Ansible bootstraps and playbook runs SSH from this pod to fleet
          # nodes. The service-account keypair lives in the kri-worker-ssh
          # Secret. Without this mount, every run_playbook / bootstrap_node
          # task fails with "Permission denied (publickey)". Mode 0600 is
          # required by OpenSSH; defaultMode is octal 384 = 0600.
          volumeMounts:
            - name: ssh-key
              mountPath: /home/appuser/.ssh
              readOnly: true
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "python3 -c 'from fleet_platform.workers.celery_app import celery_app; i=celery_app.control.inspect(timeout=3); r=i.ping(); exit(0 if r else 1)' 2>/dev/null"
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "python3 -c 'from fleet_platform.workers.celery_app import celery_app; s=celery_app.backend; exit(0)' 2>/dev/null"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
      volumes:
        - name: ssh-key
          secret:
            secretName: kri-worker-ssh
            defaultMode: 384  # 0600 — required by OpenSSH for private keys
            items:
              - key: id_ed25519
                path: id_ed25519
              - key: id_ed25519.pub
                path: id_ed25519.pub
              - key: known_hosts
                path: known_hosts
                mode: 420       # 0644 — known_hosts must be readable, not 0600
