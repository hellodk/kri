apiVersion: apps/v1
kind: Deployment
metadata:
  name: kri-beat
  namespace: kri
  labels:
    app: kri-beat
    component: beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kri-beat
  template:
    metadata:
      labels:
        app: kri-beat
        component: beat
    spec:
      containers:
        - name: beat
          image: gitea.local/kri/kri-api:0.1.415
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - celery
            - -A
            - fleet_platform.workers.celery_app
            - beat
            - --scheduler=redbeat.RedBeatScheduler
            - --loglevel=info
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: JWT_SECRET
            - name: FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: FERNET_KEY
            - name: SALT_API_URL
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: SALT_API_URL
            - name: SALT_API_USER
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: SALT_API_USER
            - name: SALT_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kri-secrets
                  key: SALT_API_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+psycopg://fleet:$(POSTGRES_PASSWORD)@postgres.utilities.svc.cluster.local:5432/fleet_platform"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis.utilities.svc.cluster.local:6379/0"
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "from fleet_platform.workers.celery_app import celery_app; s=celery_app.backend; exit(0)"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "from fleet_platform.workers.celery_app import celery_app; s=celery_app.backend; exit(0)"
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
