apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kri-api
  namespace: utilities          # app namespace — never monitoring
  labels:
    release: monitoring         # must match Prometheus serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app: kri-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
