apiVersion: v1
kind: ConfigMap
metadata:
  name: kri-datasource
  namespace: utilities           # app namespace — never monitoring
  labels:
    grafana_datasource: "1"      # Grafana sidecar picks this up via label selector
data:
  kri-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: KRI-VictoriaMetrics
        type: prometheus        # VictoriaMetrics speaks the Prometheus query API
        url: http://victoriametrics.monitoring.svc:8428
        isDefault: false         # NEVER set isDefault: true
        jsonData:
          timeInterval: "30s"
