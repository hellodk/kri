x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleet_platform
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.docker}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet_platform"]
      interval: 5s
      timeout: 3s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging: *default-logging

  pg_backup:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-fleet}
    volumes:
      - pgbackups:/var/backups/postgresql
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo '[backup] PostgreSQL backup service started';
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S);
          BACKUP_FILE=/var/backups/postgresql/fleet_$${TIMESTAMP}.dump;
          echo \"[backup] Starting pg_dump at $$(date)\";
          if pg_dump -h db -U fleet -Fc fleet_platform -f \"$${BACKUP_FILE}\"; then
            echo \"[backup] Saved $${BACKUP_FILE}\";
            find /var/backups/postgresql -name '*.dump' -mtime +7 -delete;
            echo '[backup] Pruned backups older than 7 days';
          else
            echo \"[backup] ERROR: pg_dump failed at $$(date) — skipping prune\";
            rm -f \"$${BACKUP_FILE}\";
          fi;
          sleep 86400;
        done
      "
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *default-logging

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.docker} --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    # migrate.sh acquires a PostgreSQL advisory lock before running alembic upgrade
    # head, preventing concurrent migration races when multiple API replicas start.
    command: ["sh", "-c", "bash /app/deploy/migrate.sh && uv run uvicorn fleet_platform.api.main:app --host 0.0.0.0 --port 8000 --log-level info"]
    restart: unless-stopped
    env_file: ../.env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - salt-pillar:/srv/salt/pillar
      - salt-master-pki:/etc/salt/pki/master   # read/write minion keys via API
      - /home/dk/Documents/git/pulse:/mnt/pulse:ro   # host playbook repos
      - ../salt/states:/srv/salt/states:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    command: ["uv", "run", "celery", "-A", "fleet_platform.workers.celery_app", "worker", "--queues", "default,maintenance,drift,sbom", "--concurrency", "4", "--loglevel", "info"]
    restart: unless-stopped
    env_file: ../.env.docker
    environment:
      # SALT_MASTER_CONTAINER is no longer used — salt commands now dispatch via
      # Salt HTTP API (salt-api). Set SALT_API_URL, SALT_API_USER, SALT_API_PASSWORD
      # in .env.docker (see .env.docker.example). Issue #82.
      SALT_API_URL: "${SALT_API_URL:-}"
      SALT_API_USER: "${SALT_API_USER:-}"
      SALT_API_PASSWORD: "${SALT_API_PASSWORD:-}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - salt-pillar:/srv/salt/pillar
      # SSH keys for Ansible playbook execution.
      # MUST be a dedicated service-account keypair — NOT your personal ~/.ssh.
      # Create: ssh-keygen -t ed25519 -f deploy/ssh/id_ed25519 -N ""
      # Then distribute deploy/ssh/id_ed25519.pub to target hosts.
      # Set WORKER_SSH_DIR in .env.docker to override (default: ./ssh).
      # Issue #91: operator personal ~/.ssh removed.
      - ${WORKER_SSH_DIR:-./ssh}:/home/appuser/.ssh:ro
      - ~/.kri:/home/appuser/.kri:ro
      - /home/dk/Documents/git/pulse:/mnt/pulse:ro   # host playbook repos
      # Docker socket intentionally NOT mounted — container escape risk. Issue #82.
      # Salt commands now use Salt HTTP API instead of docker exec.
    healthcheck:
      test: ["CMD-SHELL", "grep -r 'celery' /proc/*/cmdline 2>/dev/null | grep -q worker || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging: *default-logging

  salt-master:
    image: hellodk/salt-master:3008.0
    restart: unless-stopped
    ports:
      - "${SALT_BIND_IP:-0.0.0.0}:4505:4505"   # ZeroMQ publisher  — minions subscribe for events
      - "${SALT_BIND_IP:-0.0.0.0}:4506:4506"   # ZeroMQ request/reply — minions send results here
    volumes:
      - salt-pillar:/srv/salt/pillar
      - salt-master-pki:/etc/salt/pki/master   # persist accepted minion keys across restarts
      - ./salt-master.conf:/etc/salt/master.d/kri.conf:ro
      - ../salt/states:/srv/salt/states:ro
    healthcheck:
      test: ["CMD-SHELL", "grep -r 'salt-master' /proc/*/cmdline 2>/dev/null | grep -q master || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging

  beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    command: ["uv", "run", "celery", "-A", "fleet_platform.workers.celery_app", "beat", "--scheduler=redbeat.RedBeatScheduler", "--loglevel", "info"]
    restart: unless-stopped
    env_file: ../.env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - salt-pillar:/srv/salt/pillar
    healthcheck:
      test: ["CMD-SHELL", "grep -r 'celery' /proc/*/cmdline 2>/dev/null | grep -q beat || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_APP_VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api
    dns: 127.0.0.11
    dns_search: ""
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  salt-pillar:
  salt-master-pki:
  pgbackups:
