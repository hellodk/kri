x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: timescale/timescaledb:2.26.4-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleet_platform
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.docker}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet_platform"]
      interval: 5s
      timeout: 3s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging: *default-logging

  pg_backup:
    # Built from deploy/Dockerfile.pg_backup — age and rclone are baked in at
    # image build time, eliminating the runtime apt-get install (supply-chain
    # risk + ~30 s cold-start penalty, #767).
    build:
      context: ..
      dockerfile: deploy/Dockerfile.pg_backup
    # Run as the non-root postgres user. timescale/timescaledb is Alpine-based,
    # where the postgres account is uid 70 (not Debian's 999) — so reference it
    # by name. The Dockerfile pre-creates /var/backups/postgresql owned by
    # postgres so the named volume is writable without root (#762 #891).
    user: "postgres"
    restart: unless-stopped
    environment:
      # Fail loud if the password is missing — the previous default of `fleet`
      # silently let pg_dump run with a known credential when the env was
      # empty (#audit).
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.docker}
      # If set, every dump is encrypted with age (https://age-encryption.org)
      # before leaving the container. Recipient is the public key of the
      # backup operator (e.g. age1xxxxxxx...). Decrypt with:
      #   age -d -i ~/keys/kri-backup.key dump.age > dump
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      # If set, encrypted dump is rclone-copied to this remote target after
      # success. Examples:
      #   b2:my-bucket/kri/                  Backblaze B2
      #   s3:my-bucket/kri/                  AWS S3
      #   sftp-host:/srv/backups/kri/        SFTP
      # Configure the remote via BACKUP_RCLONE_CONFIG (rclone.conf contents).
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_RCLONE_CONFIG: ${BACKUP_RCLONE_CONFIG:-}
    volumes:
      - pgbackups:/var/backups/postgresql
    depends_on:
      db:
        condition: service_healthy
    # age and rclone are pre-installed in the image (see Dockerfile.pg_backup).
    # The loop runs once per 24 h; it writes a heartbeat file that the
    # healthcheck uses to verify the loop is alive (#762).
    entrypoint: >
      sh -c "
        set -eu;
        if [ -n \"$$BACKUP_RCLONE_CONFIG\" ]; then
          mkdir -p \"$$HOME/.config/rclone\";
          printf '%s\n' \"$$BACKUP_RCLONE_CONFIG\" > \"$$HOME/.config/rclone/rclone.conf\";
          chmod 600 \"$$HOME/.config/rclone/rclone.conf\";
        fi;
        echo '[backup] PostgreSQL backup service started';
        if [ -z \"$$BACKUP_AGE_RECIPIENT\" ]; then
          echo '[backup] WARNING: BACKUP_AGE_RECIPIENT is not set — dumps are stored UNENCRYPTED. Set BACKUP_AGE_RECIPIENT in production!';
        fi;
        if [ -z \"$$BACKUP_REMOTE\" ]; then
          echo '[backup] WARNING: BACKUP_REMOTE is not set — backups are LOCAL ONLY (single-disk-failure away from data loss). Set BACKUP_REMOTE in production!';
        fi;
        while true; do
          touch /var/backups/postgresql/.heartbeat;
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S);
          BASE=fleet_$${TIMESTAMP};
          OUT=/var/backups/postgresql/$${BASE}.dump;
          ENCOUT=/var/backups/postgresql/$${BASE}.dump.age;
          echo \"[backup] Starting pg_dump at $$(date)\";
          if [ -z \"$$BACKUP_AGE_RECIPIENT\" ]; then
            echo '[backup] WARNING: BACKUP_AGE_RECIPIENT is not set — dumps are stored UNENCRYPTED. Set BACKUP_AGE_RECIPIENT in production!';
          fi;
          if [ -z \"$$BACKUP_REMOTE\" ]; then
            echo '[backup] WARNING: BACKUP_REMOTE is not set — backups are LOCAL ONLY (single-disk-failure away from data loss). Set BACKUP_REMOTE in production!';
          fi;
          if pg_dump -h db -U fleet -Fc fleet_platform -f \"$$OUT\"; then
            echo \"[backup] Saved $$OUT\";
            FINAL=\"$$OUT\";
            if [ -n \"$$BACKUP_AGE_RECIPIENT\" ]; then
              if age -r \"$$BACKUP_AGE_RECIPIENT\" -o \"$$ENCOUT\" \"$$OUT\"; then
                rm -f \"$$OUT\";
                FINAL=\"$$ENCOUT\";
                echo \"[backup] Encrypted to $$ENCOUT\";
              else
                echo '[backup] WARN: age encryption failed, keeping plain dump';
              fi;
            fi;
            if [ -n \"$$BACKUP_REMOTE\" ]; then
              if rclone copy \"$$FINAL\" \"$$BACKUP_REMOTE\" --quiet; then
                echo \"[backup] Synced $$FINAL → $$BACKUP_REMOTE\";
              else
                echo \"[backup] WARN: offsite sync failed for $$FINAL\";
              fi;
            fi;
            find /var/backups/postgresql -name 'fleet_*.dump*' -mtime +7 -delete;
            echo '[backup] Pruned local backups older than 7 days';
          else
            echo \"[backup] ERROR: pg_dump failed at $$(date) — skipping prune\";
            rm -f \"$$OUT\";
          fi;
          sleep 86400;
        done
      "
    # Verify the backup loop is alive by checking the heartbeat file is
    # recent. start_period covers the time before the first heartbeat touch
    # at container startup (#762).
    healthcheck:
      test: ["CMD-SHELL", "find /var/backups/postgresql -name '.heartbeat' -mmin -1500 | grep -q ."]
      interval: 300s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *default-logging

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    # maxmemory + noeviction (#1050): cap Redis memory below the container
    # limit; noeviction makes Celery/RedBeat writes fail loudly instead of
    # silently evicting schedule/task data under pressure.
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.docker} --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    # migrate.sh acquires a PostgreSQL advisory lock before running alembic upgrade
    # head, preventing concurrent migration races when multiple API replicas start.
    # init: true runs a tiny tini-style init as PID 1 so zombie git/ssh children
    # from ansible-runner are reaped (#1050). The entrypoint script keeps the
    # chown + migrate sequence and execs uvicorn so it receives signals directly.
    init: true
    command: ["bash", "/app/deploy/api-entrypoint.sh"]
    restart: unless-stopped
    env_file: ../.env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # salt-master now runs natively on mm1 — no local PKI or pillar mounts needed.
      # Salt API URL is configured via SALT_API_URL in .env.docker.
      # Salt key listing reads from mm1 via SALT_PKI_SSH (set SALT_MASTER_SSH_HOST).
      - ${PULSE_REPOS_DIR:-./pulse}:/mnt/pulse:ro   # host playbook repos — set PULSE_REPOS_DIR in .env.docker
      - ../salt/states:/srv/salt/states:ro
      - git-repos-cache:/home/appuser/.kri/git-repos  # persist cloned git sources across redeploys
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    command: ["uv", "run", "celery", "-A", "fleet_platform.workers.celery_app", "worker", "--queues", "default,maintenance,drift,sbom", "--concurrency", "4", "--loglevel", "info"]
    # 2200s > task_time_limit=2100 (#1050): a hard-killed long task gets the
    # full SIGTERM grace window on shutdown instead of losing in-flight work.
    stop_grace_period: 2200s
    restart: unless-stopped
    env_file: ../.env.docker
    environment:
      # Salt commands dispatch via Salt HTTP API — set SALT_API_URL, SALT_API_USER,
      # SALT_API_PASSWORD in .env.docker (see .env.docker.example). Issue #82.
      SALT_API_URL: "${SALT_API_URL:-}"
      SALT_API_USER: "${SALT_API_USER:-}"
      SALT_API_PASSWORD: "${SALT_API_PASSWORD:-}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # SSH keys for Ansible playbook execution.
      # MUST be a dedicated service-account keypair — NOT your personal ~/.ssh.
      # Create: ssh-keygen -t ed25519 -f deploy/ssh/id_ed25519 -N ""
      # Then distribute deploy/ssh/id_ed25519.pub to target hosts.
      # Set WORKER_SSH_DIR in .env.docker to override (default: ./ssh).
      # Issue #91: operator personal ~/.ssh removed.
      - ${WORKER_SSH_DIR:-./ssh}:/home/appuser/.ssh:ro
      - ${KRI_DATA_DIR:-~/.kri}:/home/appuser/.kri  # rw: worker needs to write id_rsa keypair (not :ro)
      - git-repos-cache:/home/appuser/.kri/git-repos  # persist cloned git sources across redeploys
      - ${PULSE_REPOS_DIR:-./pulse}:/mnt/pulse:ro   # host playbook repos — set PULSE_REPOS_DIR in .env.docker
      # Mount playbooks/files so large binaries (salt .pkg, etc.) survive container rebuilds.
      # These files are gitignored but required for air-gapped installs.
      - ${PLAYBOOKS_FILES_DIR:-../playbooks/files}:/app/playbooks/files:ro
      # Docker socket intentionally NOT mounted — container escape risk. Issue #82.
      # Salt commands now use Salt HTTP API instead of docker exec.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import celery; from fleet_platform.workers.celery_app import celery_app; i=celery_app.control.inspect(timeout=3); r=i.ping(); exit(0 if r else 1)' 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging: *default-logging

  # Dedicated worker for long-running ansible jobs (#579) — run_playbook,
  # bootstrap_node, provision_master. Isolated from the control-plane worker so
  # a burst of 2h jobs can't starve poll_salt_masters / presence / reapers / health.
  worker-ansible:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    command: ["uv", "run", "celery", "-A", "fleet_platform.workers.celery_app", "worker", "--queues", "ansible", "--concurrency", "2", "--loglevel", "info"]
    # 3700s (#1050): ansible jobs run up to task_time_limit=2100 (35 min hard
    # kill); the grace period must outlive that so a shutdown never SIGKILLs a
    # mid-flight playbook before Celery can ack/requeue it.
    stop_grace_period: 3700s
    restart: unless-stopped
    env_file: ../.env.docker
    environment:
      # Salt commands dispatch via Salt HTTP API — set SALT_API_URL, SALT_API_USER,
      # SALT_API_PASSWORD in .env.docker (see .env.docker.example). Issue #82.
      SALT_API_URL: "${SALT_API_URL:-}"
      SALT_API_USER: "${SALT_API_USER:-}"
      SALT_API_PASSWORD: "${SALT_API_PASSWORD:-}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # SSH keys for Ansible playbook execution.
      # MUST be a dedicated service-account keypair — NOT your personal ~/.ssh.
      # Create: ssh-keygen -t ed25519 -f deploy/ssh/id_ed25519 -N ""
      # Then distribute deploy/ssh/id_ed25519.pub to target hosts.
      # Set WORKER_SSH_DIR in .env.docker to override (default: ./ssh).
      # Issue #91: operator personal ~/.ssh removed.
      - ${WORKER_SSH_DIR:-./ssh}:/home/appuser/.ssh:ro
      - ${KRI_DATA_DIR:-~/.kri}:/home/appuser/.kri  # rw: worker needs to write id_rsa keypair (not :ro)
      - git-repos-cache:/home/appuser/.kri/git-repos  # persist cloned git sources across redeploys
      - ${PULSE_REPOS_DIR:-./pulse}:/mnt/pulse:ro   # host playbook repos — set PULSE_REPOS_DIR in .env.docker
      # Mount playbooks/files so large binaries (salt .pkg, etc.) survive container rebuilds.
      # These files are gitignored but required for air-gapped installs.
      - ${PLAYBOOKS_FILES_DIR:-../playbooks/files}:/app/playbooks/files:ro
      # Docker socket intentionally NOT mounted — container escape risk. Issue #82.
      # Salt commands now use Salt HTTP API instead of docker exec.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import celery; from fleet_platform.workers.celery_app import celery_app; i=celery_app.control.inspect(timeout=3); r=i.ping(); exit(0 if r else 1)' 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging: *default-logging

  # salt-master removed from Docker — runs natively on mm1 (127.0.0.1).
  # See playbooks/roles/salt_master and playbooks/setup_salt_master.yml.
  # This eliminates the PKI key rotation issue caused by container restarts.
  # Configure SALT_API_URL=http://127.0.0.1:8080 in .env.docker.

  beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    command: ["uv", "run", "celery", "-A", "fleet_platform.workers.celery_app", "beat", "--scheduler=redbeat.RedBeatScheduler", "--loglevel", "info"]
    # 2200s (#1050): match the default worker so a beat shutdown mid-schedule
    # write (RedBeat lock release) isn't cut off by the 10 s Docker default.
    stop_grace_period: 2200s
    restart: unless-stopped
    env_file: ../.env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: []
    healthcheck:
      # Real check (#1050): the old probe imported celery_app and exited 0 —
      # tautological. This pings Redis via settings.redis_url and SCANs for any
      # RedBeat key (prefix 'redbeat:', e.g. redbeat::lock / redbeat:*); exit 0
      # when found, 30 when the scheduler has no state in Redis yet.
      test: ["CMD-SHELL", "python3 -c 'import sys,redis; from fleet_platform.core.config import settings; r=redis.from_url(settings.redis_url); r.ping(); sys.exit(0 if r.scan(0,match=\"redbeat:*\",count=5)[1] else 30)' 2>/dev/null || exit 30"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_APP_VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      # NGINX_RESOLVER is substituted into nginx.conf at container start so the
      # frontend container works on Docker (default 127.0.0.11), Podman rootful
      # (10.88.0.1), Podman rootless (10.0.2.3), or k8s (override per cluster).
      NGINX_RESOLVER: "${NGINX_RESOLVER:-127.0.0.11}"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  pgbackups:
  git-repos-cache:   # cloned git playbook sources — survives api/worker redeploys
