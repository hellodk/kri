# Use Docker's embedded DNS resolver so nginx re-resolves 'api' on every
# request cycle rather than caching the IP at startup. Without this, nginx
# caches the IP resolved at boot time — if the API container is redeployed
# and gets a new IP, nginx keeps trying the old one and returns 502 until
# the frontend container is also restarted.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — apply to all responses including 4xx/5xx (always)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # WebSocket endpoints — SSH and VNC proxies hold in-process session state.
    # Use a variable for proxy_pass so nginx re-resolves DNS on reconnect.
    location ~ ^/api/v1/(ssh|vnc)/session/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # All other API/auth requests
    location ~ ^/(auth|api)/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Expect "";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
