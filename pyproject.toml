[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-platform"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "starlette>=1.3.1",  # CVE-2026-54282/54283 (transitive via fastapi)
    "gitpython>=3.1.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.18.4",
    "psycopg[async,binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j
    "pyjwt[crypto]>=2.13.0",
    "bcrypt>=4.2.0",
    "celery[redis]>=5.6.3",
    "redis>=5.2.0",
    "celery-redbeat>=2.3.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.31",  # CVE-2026-53538/53539/53540
    "httpx>=0.28.1",
    "anthropic>=0.40",
    "slowapi>=0.1.10",
    "aiofiles>=25.1.0",
    "email-validator>=2.3.0",
    "pyyaml>=6.0.3",
    "ansible-runner>=2.4.0",
    "ansible-core>=2.17.0",
    "cryptography>=48.0.1",  # GHSA-537c-gmf6-5ccf
    "authlib>=1.3",
    "idna>=3.17",           # CVE-2026-45409: ReDoS in encode(); fix in 3.15
    "asyncssh>=2.23.1",
    "requests>=2.34.2",
    "prometheus-client>=0.20",
    "pgvector>=0.4.2",
    # OpenTelemetry — wire real distributed tracing so trace_id in logs maps to
    # spans in Tempo (replaces the random UUID4 fallback in core/logging.py).
    # Configure via OTEL_EXPORTER_OTLP_ENDPOINT; if unset the SDK is a no-op.
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-celery>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
    "mypy>=2.1.0",
    "vulture>=2.11",
    "bandit[toml]>=1.7",
    "pre-commit>=4.6.0",
    "hypothesis>=6.155.2",
    "mutmut>=3.1.0",
]

# Only package fleet_platform — exclude playbooks/ and other top-level dirs.
[tool.setuptools.packages.find]
include = ["fleet_platform*"]

# Version is read dynamically from the VERSION file — do not add it here.
# Single source of truth: edit VERSION, everything else follows.
[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"fleet_platform/db/migrations/versions/*.py" = ["E501", "E402"]
"fleet_platform/services/digest_svc.py" = ["E501"]
"fleet_platform/workers/playbook_tasks.py" = ["E501"]
"tests/integration/test_node_import_api.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fleet_platform"]

[tool.mutmut]
paths_to_mutate = "fleet_platform/services/"
tests_dir = "tests/unit/"
runner = "python -m pytest tests/unit/ -x -q --tb=no --no-header"
