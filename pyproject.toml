[project]
name = "fleet-platform"
version = "0.1.6"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "gitpython>=3.1.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[async,binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt[crypto]>=2.9.0",
    "bcrypt>=4.2.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "slowapi>=0.1.9",
    "aiofiles>=24.1.0",
    "email-validator>=2.2.0",
    "pyyaml>=6.0",
    "ansible-runner>=2.4.0",
    "ansible-core>=2.17.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["fleet_platform"]
