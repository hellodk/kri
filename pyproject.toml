[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-platform"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "starlette>=1.3.1",  # CVE-2026-54282/54283 (transitive via fastapi)
    "gitpython>=3.1.51",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg[async,binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j
    "pyjwt[crypto]>=2.13.0",
    "bcrypt>=5.0.0",
    "celery[redis]>=5.6.3",
    "redis>=5.3.1",
    "celery-redbeat>=2.3.3",
    "structlog>=26.1.0",
    "python-multipart>=0.0.32",  # CVE-2026-53538/53539/53540
    "httpx>=0.28.1",
    "anthropic>=0.116.0",
    "slowapi>=0.1.10",
    "aiofiles>=25.1.0",
    "email-validator>=2.3.0",
    "pyyaml>=6.0.3",
    "ansible-runner>=2.4.3",
    "ansible-core>=2.21.1",
    "cryptography>=49.0.0",  # GHSA-537c-gmf6-5ccf
    "authlib>=1.7.2",
    "idna>=3.18",           # CVE-2026-45409: ReDoS in encode(); fix in 3.15
    "asyncssh>=2.24.0",
    "requests>=2.34.2",
    "prometheus-client>=0.25.0",
    "pgvector>=0.5.0",
    # OpenTelemetry — wire real distributed tracing so trace_id in logs maps to
    # spans in Tempo (replaces the random UUID4 fallback in core/logging.py).
    # Configure via OTEL_EXPORTER_OTLP_ENDPOINT; if unset the SDK is a no-op.
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.64b0",
    "opentelemetry-instrumentation-celery>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
    "opentelemetry-instrumentation-redis>=0.64b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
    "mypy>=2.2.0",
    "vulture>=2.16",
    "bandit[toml]>=1.9.4",
    "pre-commit>=4.6.0",
    "hypothesis>=6.156.6",
    # Pin below 3.6.0: that release renamed the [tool.mutmut] keys
    # (paths_to_mutate->source_paths, tests_dir folded into
    # pytest_add_cli_args_test_selection) AND shipped a config-loader bug that
    # crashes `mutmut results` with "can only concatenate list (not 'str') to
    # list", failing the mutation CI job. 3.5.0 reads our string-valued config.
    "mutmut>=3.6.0,<3.7.0",
]

# Only package fleet_platform — exclude playbooks/ and other top-level dirs.
[tool.setuptools.packages.find]
include = ["fleet_platform*"]

# Version is read dynamically from the VERSION file — do not add it here.
# Single source of truth: edit VERSION, everything else follows.
[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"fleet_platform/db/migrations/versions/*.py" = ["E501", "E402"]
"fleet_platform/services/digest_svc.py" = ["E501"]
"fleet_platform/workers/playbook_tasks.py" = ["E501"]
"tests/integration/test_node_import_api.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fleet_platform"]

[tool.mutmut]
paths_to_mutate = "fleet_platform/services/,fleet_platform/agent/"
tests_dir = "tests/unit/"
runner = "python -m pytest tests/unit/ -x -q --tb=no --no-header"

# Narrow scope used by the mutation CI workflow (.github/workflows/mutation.yml).
# Run manually with:
#   mutmut run --paths-to-mutate=fleet_platform/core/validators.py,fleet_platform/core/redaction.py
# The workflow overrides paths_to_mutate on the CLI so this section documents
# intent rather than being read directly by the workflow.
