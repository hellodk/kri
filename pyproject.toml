[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-platform"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "gitpython>=3.1.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[async,binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt[crypto]>=2.9.0",
    "bcrypt>=4.2.0",
    "celery[redis]>=5.6.3",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "anthropic>=0.40",
    "slowapi>=0.1.9",
    "aiofiles>=25.1.0",
    "email-validator>=2.2.0",
    "pyyaml>=6.0.3",
    "ansible-runner>=2.4.0",
    "ansible-core>=2.17.0",
    "cryptography>=43.0.0",
    "authlib>=1.3",
    "idna>=3.15",           # CVE-2026-45409: ReDoS in encode(); fix in 3.15
    "asyncssh>=2.14.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
    "mypy>=1.10",
    "vulture>=2.11",
    "bandit[toml]>=1.7",
    "pre-commit>=3.7",
]

# Only package fleet_platform — exclude playbooks/ and other top-level dirs.
[tool.setuptools.packages.find]
include = ["fleet_platform*"]

# Version is read dynamically from the VERSION file — do not add it here.
# Single source of truth: edit VERSION, everything else follows.
[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"fleet_platform/db/migrations/versions/*.py" = ["E501", "E402"]
"fleet_platform/services/digest_svc.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fleet_platform"]
