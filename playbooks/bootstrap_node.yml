---
# playbooks/bootstrap_node.yml
# Bootstraps a fleet node (macOS or Linux) into the kri fleet.
#
# Required variables (set in host_vars or pass -e):
#   salt_masters           — List of Salt master addresses (LAN IP / hostname).
#                            Must contain at least one entry. When multiple are supplied
#                            the minion is configured for HA failover (master_type: failover).
#   salt_master_pub_key    — Contents of deploy/salt-pki/master.pub (never changes)
#   minion_id              — Salt minion ID (e.g. mm1)
#   ingest_url             — kri ingest API base (e.g. http://127.0.0.1/api/v1/ingest)
#   node_token             — Per-node token from kri Settings → Nodes
#
# Optional:
#   artifactory_binary_url — Artifactory mirror base URL (air-gap mode)
#   controller_pubkey      — SSH public key to add to authorized_keys
#   otlp_endpoint          — OTLP push target for otel_collector (default: cluster otel-gateway)
#   otlp_protocol          — 'http' or 'grpc' (default: 'http')
#   otlp_headers           — Optional OTLP exporter headers (default: empty)
#
# Version pins: see group_vars/all.yml
#
# This playbook is a thin orchestrator (roles-refactor Phase 3). It runs as TWO
# plays so that node monitoring is DECOUPLED from Salt (#967): node_exporter must
# land even when the salt-master is unreachable, so it runs in its own play
# BEFORE and OUTSIDE the salt reachability gate. The work lives in:
#   playbooks/tasks/host_prep_gate.yml — master reachability gate (#536/#537)
#   playbooks/tasks/host_prep.yml      — Xcode CLT, authorized_keys, VNC
#   playbooks/roles/common              — OS/arch fact normalization
#   playbooks/roles/salt_minion         — salt-minion install/config/service
#   playbooks/roles/node_telemetry      — psutil/macmon
#   playbooks/roles/node_exporter       — Prometheus node_exporter (Salt-independent)
#   playbooks/roles/otel_collector      — otelcol-contrib: scrapes node_exporter,
#                                          pushes OTLP metrics (Salt-independent, #968)
#   playbooks/roles/kri_enroll          — Salt schedules + grains push

# ── Play 1: node monitoring — independent of Salt ─────────────────────────────
# Runs first and is NOT gated on salt-master reachability, so metrics land on
# every reachable host regardless of Salt enrolment success.
- name: Install node monitoring (independent of Salt)
  hosts: targets
  gather_facts: true
  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    ansible_become: true
    ansible_become_method: sudo

  pre_tasks:
    - name: Normalize OS/arch facts (common role)
      ansible.builtin.import_role:
        name: common

  roles:
    - node_exporter
    - otel_collector

# ── Play 2: Salt enrolment + telemetry — gated on salt-master reachability ─────
- name: Enrol fleet node into kri Salt fleet
  hosts: targets
  gather_facts: true
  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    ansible_become: true
    ansible_become_method: sudo

  pre_tasks:
    - name: Normalize OS/arch facts (common role)
      ansible.builtin.import_role:
        name: common

    - name: Gate on salt-master reachability from this node
      ansible.builtin.import_tasks: tasks/host_prep_gate.yml

    - name: Host prep — Xcode CLT (before Homebrew), authorized_keys, VNC
      ansible.builtin.import_tasks: tasks/host_prep.yml

  roles:
    - salt_minion
    - node_telemetry
    - kri_enroll
