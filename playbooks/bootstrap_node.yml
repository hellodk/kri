---
# playbooks/bootstrap_node.yml
# Bootstraps a fleet node (macOS or Linux) into the kri fleet.
#
# Required variables (set in host_vars or pass -e):
#   salt_masters           — List of Salt master addresses (Tailscale IP / hostname).
#                            Must contain at least one entry. When multiple are supplied
#                            the minion is configured for HA failover (master_type: failover).
#   salt_master_pub_key    — Contents of deploy/salt-pki/master.pub (never changes)
#   minion_id              — Salt minion ID (e.g. mm1)
#   ingest_url             — kri ingest API base (e.g. http://100.89.50.27/api/v1/ingest)
#   node_token             — Per-node token from kri Settings → Nodes
#
# Optional:
#   artifactory_binary_url — Artifactory mirror base URL (air-gap mode)
#   controller_pubkey      — SSH public key to add to authorized_keys
#
# Version pins: see group_vars/all.yml

- name: Bootstrap fleet node into kri fleet
  hosts: targets
  gather_facts: false
  vars:
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    ansible_become: true
    ansible_become_method: sudo

  tasks:

    # ── Detect architecture ──────────────────────────────────────────────────
    - name: Detect CPU architecture
      raw: uname -m
      register: uname_result
      changed_when: false

    - name: Set cpu_arch and ne_arch facts
      set_fact:
        cpu_arch: "{{ 'arm64' if 'arm64' in uname_result.stdout else 'x86_64' }}"
        ne_arch: "{{ 'arm64' if 'arm64' in uname_result.stdout else 'amd64' }}"

    # ── Fact collection (detects OS family for all subsequent conditionals) ──
    - name: Gather OS and hardware facts
      setup:
        gather_subset: ['min', 'hardware']

    # ── Set OS-specific runtime facts ────────────────────────────────────────
    - name: Set OS-specific facts
      set_fact:
        ne_os: "{{ 'darwin' if ansible_os_family == 'Darwin' else 'linux' }}"
        salt_call_bin: "{{ '/opt/salt/salt-call' if ansible_os_family == 'Darwin' else 'salt-call' }}"
        salt_group: "{{ 'wheel' if ansible_os_family == 'Darwin' else 'root' }}"
        brew_prefix: >-
          {{ brew_prefix_arm64 if cpu_arch == 'arm64' else brew_prefix_x86 }}

    # ── Node-vantage master reachability gate (#536, epic #537) ─────────────
    # Check that THIS NODE can reach each configured salt-master on ports
    # 4505 (publish) and 4506 (return) before writing any minion config.
    # A worker-side probe (salt_master_probe.py) tests control-plane
    # reachability; this tests MINION-vantage reachability, which is what
    # actually matters for Salt to function.
    - name: Check TCP reachability to each salt-master on port 4505
      shell: "nc -z -w3 {{ item }} 4505 && echo reachable || echo unreachable"
      loop: "{{ salt_masters }}"
      register: nc_4505_results
      failed_when: false
      changed_when: false
      become: false

    - name: Check TCP reachability to each salt-master on port 4506
      shell: "nc -z -w3 {{ item }} 4506 && echo reachable || echo unreachable"
      loop: "{{ salt_masters }}"
      register: nc_4506_results
      failed_when: false
      changed_when: false
      become: false

    - name: Log master reachability from this node
      debug:
        msg: >-
          Master {{ item.item }}:
          4505={{ 'reachable' if item.rc == 0 else 'UNREACHABLE' }},
          4506={{ (nc_4506_results.results[nc_4505_results.results.index(item)].rc == 0) | ternary('reachable', 'UNREACHABLE') }}
      loop: "{{ nc_4505_results.results }}"

    - name: Fail if no salt-master is reachable from this node
      fail:
        msg: >-
          Target cannot reach any salt-master on 4505/4506 — check network/firewall.
          Masters probed: {{ salt_masters | join(', ') }}
      when: nc_4505_results.results | selectattr('rc', 'eq', 0) | list | length == 0
            and nc_4506_results.results | selectattr('rc', 'eq', 0) | list | length == 0

    # ── macOS: Detect actual user (even when SSH'd as root) ─────────────────
    - name: Get logged-in macOS user from console
      shell: stat -f "%Su" /dev/console
      register: mac_console_user
      changed_when: false
      become: false
      failed_when: false
      when: ansible_os_family == 'Darwin'

    - name: Set brew_user fact (macOS)
      set_fact:
        brew_user: "{{ ansible_user if ansible_user != 'root' else mac_console_user.stdout }}"
      when: ansible_os_family == 'Darwin'

    # ── macOS: Xcode Command Line Tools ──────────────────────────────────────
    - name: Check if Xcode CLT is installed
      command: xcode-select -p
      register: xcode_check
      failed_when: false
      changed_when: false
      become: false
      when: ansible_os_family == 'Darwin'

    - name: Install Xcode Command Line Tools (headless via softwareupdate)
      shell: |
        touch /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
        LABEL=$(softwareupdate -l 2>&1 | awk -F'*' '/Command Line/{print $2}' | head -1 | xargs)
        if [ -n "$LABEL" ]; then
          softwareupdate -i "$LABEL" --agree-to-license
        fi
        rm -f /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
      when: ansible_os_family == 'Darwin' and xcode_check.rc != 0
      become: true
      timeout: 600
      register: clt_install
      changed_when: clt_install.rc == 0

    # ── macOS: Salt-minion via official onedir pkg (pinned, air-gap ready) ──
    # Uses the Salt Project's onedir installer — installs to /opt/salt/
    # Not Homebrew: Homebrew does not allow pinning specific salt versions.
    # For air-gap: set artifactory_binary_url in group_vars/all.yml or host_vars/.

    - name: Resolve salt pkg filename for this arch (macOS)
      set_fact:
        salt_pkg_filename: "{{ salt_pkg_arm64 if cpu_arch == 'arm64' else salt_pkg_x86_64 }}"
        salt_checksum_filename: "{{ salt_pkg_checksum_arm64 if cpu_arch == 'arm64' else salt_pkg_checksum_x86_64 }}"
      when: ansible_os_family == 'Darwin'

    # Resolution precedence: salt_pkg_url_override > artifactory_binary_url +
    # artifactory_salt_path > salt_pkg_official_base. Defaults (artifactory_salt_path
    # = salt/{{ salt_version }}) reproduce the previous URL exactly. The checksum
    # follows the same tiers; when the pkg is fully overridden, the checksum is
    # taken from the same directory (override | dirname) since it is a sibling file.
    - name: Set download URL (override > Artifactory > official) (macOS)
      set_fact:
        salt_pkg_url: >-
          {%- if salt_pkg_url_override -%}{{ salt_pkg_url_override }}
          {%- elif artifactory_binary_url -%}{{ artifactory_binary_url.rstrip('/') }}/{{ artifactory_salt_path }}/{{ salt_pkg_filename }}
          {%- else -%}{{ salt_pkg_official_base }}/{{ salt_pkg_filename }}
          {%- endif -%}
        salt_checksum_url: >-
          {%- if salt_pkg_url_override -%}{{ salt_pkg_url_override | dirname }}/{{ salt_checksum_filename }}
          {%- elif artifactory_binary_url -%}{{ artifactory_binary_url.rstrip('/') }}/{{ artifactory_salt_path }}/{{ salt_checksum_filename }}
          {%- else -%}{{ salt_pkg_official_base }}/{{ salt_checksum_filename }}
          {%- endif -%}
      when: ansible_os_family == 'Darwin'

    # NOTE: do NOT use `/opt/salt/salt-minion --version` for detection — on the
    # macOS onedir build it prints the version then continues booting the daemon
    # (never reaches EOF), so a piped `| awk` hangs until ANSIBLE_TASK_TIMEOUT.
    # pkgutil reads the installed .pkg receipt and exits cleanly+instantly.
    - name: Check installed salt version (macOS)
      shell: pkgutil --pkg-info com.saltstack.salt 2>/dev/null | awk '/^version:/ {print $2}'
      register: installed_salt_version
      changed_when: false
      failed_when: false
      become: false
      when: ansible_os_family == 'Darwin'

    - name: Download salt pkg checksum (macOS)
      get_url:
        url: "{{ salt_checksum_url }}"
        dest: "/tmp/{{ salt_checksum_filename }}"
        mode: "0644"
        force: true
      when: ansible_os_family == 'Darwin' and installed_salt_version.stdout.strip() != salt_version
      become: false

    - name: Download salt pkg with verified checksum (macOS)
      get_url:
        url: "{{ salt_pkg_url }}"
        dest: "/tmp/{{ salt_pkg_filename }}"
        mode: "0644"
      when: ansible_os_family == 'Darwin' and installed_salt_version.stdout.strip() != salt_version
      become: false

    - name: Verify salt pkg checksum (macOS)
      shell: |
        EXPECTED=$(cat /tmp/{{ salt_checksum_filename }} | awk '{print $1}')
        ACTUAL=$(shasum -a 512 /tmp/{{ salt_pkg_filename }} | awk '{print $1}')
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "CHECKSUM MISMATCH: expected $EXPECTED got $ACTUAL" >&2
          exit 1
        fi
        echo "Checksum OK: $ACTUAL"
      when: ansible_os_family == 'Darwin' and installed_salt_version.stdout.strip() != salt_version
      changed_when: false
      become: false

    - name: Stop salt-minion service before upgrade (macOS)
      shell: launchctl stop com.saltstack.salt.minion 2>/dev/null || true
      when: ansible_os_family == 'Darwin' and installed_salt_version.stdout.strip() != salt_version
      become: true
      changed_when: false

    - name: Install salt pkg (macOS)
      shell: installer -pkg /tmp/{{ salt_pkg_filename }} -target /
      when: ansible_os_family == 'Darwin' and installed_salt_version.stdout.strip() != salt_version
      become: true
      register: salt_install_result
      changed_when: salt_install_result.rc == 0

    # Use pkgutil (clean exit) instead of `salt-minion --version` (boots daemon → hangs).
    - name: Confirm installed salt version matches expected (macOS)
      shell: pkgutil --pkg-info com.saltstack.salt 2>/dev/null | awk '/^version:/ {print $2}'
      register: verified_salt_version
      changed_when: false
      failed_when: verified_salt_version.stdout.strip() != salt_version
      become: false
      when: ansible_os_family == 'Darwin' and salt_install_result is defined and salt_install_result.changed

    # ── Linux: Install salt-minion via apt or dnf ────────────────────────────
    - name: Install salt-minion (Linux)
      include_tasks: tasks/bootstrap/minion_linux.yml
      when: ansible_os_family in ['Debian', 'RedHat']

    # ── Salt configuration (shared macOS + Linux) ────────────────────────────
    - name: Create /etc/salt directory
      file:
        path: /etc/salt
        state: directory
        owner: root
        group: "{{ salt_group }}"
        mode: "0755"
      become: true

    - name: Create /etc/salt/pki/minion directory
      file:
        path: /etc/salt/pki/minion
        state: directory
        owner: root
        group: "{{ salt_group }}"
        mode: "0700"
      become: true

    - name: Write Salt minion config
      copy:
        dest: /etc/salt/minion
        owner: root
        group: "{{ salt_group }}"
        mode: "0644"
        content: |
          master:
          {% for m in salt_masters %}    - {{ m }}
          {% endfor %}
          master_type: failover
          master_alive_interval: 60
          master_tries: -1
          random_master: True
          id: {{ minion_id }}
          log_level: info
          log_file: /var/log/salt/minion
          encryption_algorithm: OAEP-SHA1
      become: true

    # Write the master's public key directly so the minion never needs to
    # perform a full initial re-authentication (which requires session support
    # and is incompatible across minor Salt versions).
    # This key is stable — it lives in deploy/salt-pki/master.pub and
    # must be supplied as the salt_master_pub_key variable.
    - name: Write master public key to minion PKI (prevents re-auth on reconnect)
      copy:
        dest: /etc/salt/pki/minion/minion_master.pub
        content: "{{ salt_master_pub_key }}"
        owner: root
        group: "{{ salt_group }}"
        mode: "0644"
      become: true
      # Pre-seed only when a master pubkey is supplied (#549). Omitted in
      # multi-master HA: the minion TOFU-fetches each master's key on first
      # connect and its key is accepted on the master (kri Salt Keys UI /
      # salt-key -a / auto_accept). Without this the minion still installs,
      # configures, and connects — it just pends for key acceptance.
      when: salt_master_pub_key is defined

    # ── Start or restart salt-minion ─────────────────────────────────────────
    - name: Load salt-minion launchd service (macOS)
      shell: launchctl load -w /Library/LaunchDaemons/com.saltstack.salt.minion.plist 2>/dev/null || true
      become: true
      changed_when: false
      when: ansible_os_family == 'Darwin'

    - name: Start salt-minion service (macOS)
      shell: launchctl start com.saltstack.salt.minion 2>/dev/null || true
      become: true
      changed_when: false
      when: ansible_os_family == 'Darwin'

    - name: Enable and start salt-minion via systemd (Linux)
      systemd:
        name: salt-minion
        enabled: true
        state: started
        daemon_reload: true
      become: true
      when: ansible_os_family in ['Debian', 'RedHat']

    - name: Verify salt-minion process is running
      shell: ps aux | grep -v grep | grep salt-minion
      register: minion_pid_check
      failed_when: minion_pid_check.rc != 0
      changed_when: false
      retries: 6
      delay: 5
      become: false

    # ── Authorised keys ───────────────────────────────────────────────────────
    - name: Ensure ~/.ssh directory exists
      file:
        path: "~/.ssh"
        state: directory
        mode: "0700"
      become: false
      when: controller_pubkey is defined

    - name: Authorise kri controller public key
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ controller_pubkey }}"
        state: present
      become: false
      when: controller_pubkey is defined

    # ── macOS: Enable Screen Sharing (VNC) ────────────────────────────────────
    - name: Enable macOS Screen Sharing (VNC on port 5900)
      shell: |
        /bin/launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
        /usr/bin/defaults write /var/db/RealVNC/vncserver Enabled -bool true 2>/dev/null || true
      become: true
      failed_when: false
      changed_when: false
      when: ansible_os_family == 'Darwin'

    # ── macOS: Collect grains ─────────────────────────────────────────────────
    - name: Collect macOS version
      shell: sw_vers -productVersion 2>/dev/null || true
      register: sw_vers_result
      changed_when: false
      become: false
      failed_when: false
      when: ansible_os_family == 'Darwin'

    - name: Collect CPU core count (macOS)
      shell: sysctl -n hw.logicalcpu 2>/dev/null || echo "0"
      register: cpu_cores_result
      changed_when: false
      become: false
      failed_when: false
      when: ansible_os_family == 'Darwin'

    - name: Collect RAM in MB (macOS)
      shell: "python3 -c \"import subprocess; r=subprocess.run(['sysctl','-n','hw.memsize'],capture_output=True,text=True); print(int(r.stdout.strip())//1024//1024)\" 2>/dev/null || echo '0'"
      register: ram_mb_result
      changed_when: false
      become: false
      failed_when: false
      when: ansible_os_family == 'Darwin'

    - name: Collect hardware model (macOS)
      shell: |
        sysctl -n hw.model 2>/dev/null ||
        system_profiler SPHardwareDataType 2>/dev/null | awk -F': ' '/Model Identifier/{print $2}' ||
        echo ''
      register: hw_model_result
      changed_when: false
      become: false
      failed_when: false
      when: ansible_os_family == 'Darwin'

    - name: Collect serial number (macOS)
      shell: |
        system_profiler SPHardwareDataType 2>/dev/null | awk -F': ' '/Serial Number/{print $2}' | tr -d ' \n\r' ||
        echo ''
      register: serial_result
      changed_when: false
      become: false
      failed_when: false
      when: ansible_os_family == 'Darwin'

    - name: Collect installed Homebrew packages (macOS)
      shell: "{{ brew_prefix }}/bin/brew list --versions 2>/dev/null || true"
      register: brew_list_result
      changed_when: false
      become: false
      become_user: "{{ brew_user }}"
      environment:
        PATH: "{{ brew_prefix }}/bin:/usr/local/bin:/usr/bin:/bin"
        HOME: "/Users/{{ brew_user }}"
      failed_when: false
      when: ansible_os_family == 'Darwin'

    - name: Parse brew packages into dict (macOS)
      set_fact:
        brew_pkgs: "{{ brew_pkgs | default({}) | combine({item.split()[0]: item.split()[1] | default('')}) }}"
      loop: "{{ brew_list_result.stdout_lines | default([]) | select('match', '^[a-zA-Z].*') | list }}"
      when: ansible_os_family == 'Darwin' and brew_list_result is defined and brew_list_result.rc == 0 and brew_list_result.stdout != ''

    # ── Node telemetry / tooling dependencies ─────────────────────────────────
    # Install psutil (both OS — required by the Salt process_collector that feeds
    # the Processes tab), plus macmon and tart (macOS-only Homebrew CLIs).
    # Placed before the process_report schedule so psutil is present first.
    - name: Install node telemetry and tooling dependencies (psutil, macmon, tart)
      include_tasks: tasks/bootstrap/node_deps.yml

    # ── Install kri heartbeat schedule via Salt ───────────────────────────────
    # This runs base.heartbeat on the minion so grain_report is sent every
    # 5 minutes automatically. Without this, nodes go offline after 15 min.
    # Waits for salt-master to accept the minion key first (may take ~10s).
    - name: Wait for salt-master to accept minion key
      command: >
        {{ salt_call_bin }} --local test.ping
      register: salt_ping
      retries: 12
      delay: 5
      until: salt_ping.rc == 0
      become: true
      changed_when: false
      failed_when: false

    - name: Apply kri heartbeat schedule via salt-call
      shell: |
        {{ salt_call_bin }} state.apply base.heartbeat
      become: true
      changed_when: false
      failed_when: false
      when: salt_ping.rc == 0

    # ── Install kri process-telemetry schedule via Salt ───────────────────────
    # Runs base.process_report every 30s so the node reports per-process
    # CPU/mem/io to the kri ingest API (Processes tab data source, #610/#625).
    - name: Apply kri process-report schedule via salt-call
      shell: |
        {{ salt_call_bin }} state.apply base.process_report_schedule
      become: true
      changed_when: false
      failed_when: false
      when: salt_ping.rc == 0

    # ── Push initial grains to kri Fleet Platform (macOS) ────────────────────
    - name: Push Ansible facts + packages as grains to kri ingest API (macOS)
      uri:
        url: "{{ ingest_url }}/grains"
        method: POST
        headers:
          Content-Type: "application/json"
          X-Node-Token: "{{ node_token }}"
        body_format: json
        body:
          minion_id: "{{ minion_id }}"
          grains:
            id: "{{ minion_id }}"
            host: "{{ ansible_hostname | default(minion_id) }}"
            fqdn: "{{ ansible_fqdn | default(ansible_hostname) | default(minion_id) }}"
            os: "MacOS"
            os_family: "MacOS"
            osfullname: "macOS"
            osrelease: "{{ sw_vers_result.stdout | trim | default('') }}"
            kernel: "Darwin"
            kernelrelease: "{{ ansible_kernel | default('') }}"
            cpuarch: "{{ cpu_arch }}"
            num_cpus: "{{ cpu_cores_result.stdout | trim | int | default(0) }}"
            mem_total: "{{ ram_mb_result.stdout | trim | int | default(0) }}"
            productname: "{{ hw_model_result.stdout | trim | regex_replace('[\\x00]', '') | default('') }}"
            serialnumber: "{{ serial_result.stdout | trim | default('') }}"
            saltversion: "{{ salt_version }}"
            ip4_interfaces:
              "{{ ansible_default_ipv4.interface | default('en0') }}":
                - "{{ ansible_default_ipv4.address | default('') }}"
            brew_pkgs: "{{ brew_pkgs | default({}) }}"
        status_code: [200, 201, 204]
        timeout: 30
      become: false
      no_log: true
      failed_when: false
      when: ingest_url is defined and node_token is defined and ansible_os_family == 'Darwin'

    # ── Push initial grains to kri Fleet Platform (Linux) ────────────────────
    - name: Push Ansible facts as grains to kri ingest API (Linux)
      uri:
        url: "{{ ingest_url }}/grains"
        method: POST
        headers:
          Content-Type: "application/json"
          X-Node-Token: "{{ node_token }}"
        body_format: json
        body:
          minion_id: "{{ minion_id }}"
          grains:
            id: "{{ minion_id }}"
            host: "{{ ansible_hostname | default(minion_id) }}"
            fqdn: "{{ ansible_fqdn | default(ansible_hostname) | default(minion_id) }}"
            os: "{{ ansible_distribution | default('Linux') }}"
            os_family: "{{ ansible_os_family | default('Linux') }}"
            osfullname: "{{ ansible_distribution | default('Linux') }}"
            osrelease: "{{ ansible_distribution_version | default('') }}"
            kernel: "Linux"
            kernelrelease: "{{ ansible_kernel | default('') }}"
            cpuarch: "{{ cpu_arch }}"
            num_cpus: "{{ ansible_processor_vcpus | default(0) }}"
            mem_total: "{{ ansible_memtotal_mb | default(0) }}"
            productname: "{{ ansible_product_name | default('') }}"
            serialnumber: "{{ ansible_product_serial | default('') }}"
            saltversion: "{{ salt_version }}"
            ip4_interfaces:
              "{{ ansible_default_ipv4.interface | default('eth0') }}":
                - "{{ ansible_default_ipv4.address | default('') }}"
        status_code: [200, 201, 204]
        timeout: 30
      become: false
      no_log: true
      failed_when: false
      when: ingest_url is defined and node_token is defined and ansible_os_family != 'Darwin'

    # ── node_exporter (Prometheus metrics on :9100) ───────────────────────────
    - name: Install node_exporter (macOS)
      include_tasks: tasks/bootstrap/node_exporter_macos.yml
      when: ansible_os_family == 'Darwin'

    - name: Install node_exporter (Linux)
      include_tasks: tasks/bootstrap/node_exporter_linux.yml
      when: ansible_os_family in ['Debian', 'RedHat']
