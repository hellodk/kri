---
# playbooks/update_salt_master_url.yml
# Update the SALT_API_URL setting in kri after deploying salt-master on mm1.
# Run this after deploy_salt_master_mm1.yml completes.
#
# Variables:
#   salt_master_host   IP of the salt-master host (default: 100.102.68.75)
#   salt_api_port      Port (default: 8080)
#   kri_api_url        kri API base URL (default: http://localhost)
#   kri_admin_token    Bearer token for kri API (required — get from kri UI Settings → API Tokens)
#
# Usage:
#   ansible-playbook playbooks/update_salt_master_url.yml \
#     -i playbooks/inventory/hosts.ini \
#     -e "kri_admin_token=<token>"

- name: Update kri salt-master URL setting
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    salt_master_host: "100.102.68.75"
    salt_api_port: 8080
    kri_api_url: "http://localhost"

  tasks:
    - name: Update salt_master_address in kri settings
      uri:
        url: "{{ kri_api_url }}/api/v1/settings"
        method: PUT
        headers:
          Authorization: "Bearer {{ kri_admin_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          salt_master_address: "{{ salt_master_host }}"
        status_code: 200
      register: update_result

    - name: Confirm setting updated
      debug:
        msg: "salt_master_address updated to {{ salt_master_host }}. Restart kri workers to apply."
