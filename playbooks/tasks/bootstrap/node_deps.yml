---
# playbooks/tasks/bootstrap/node_deps.yml
# Node telemetry / tooling dependencies installed during bootstrap.
# Dispatched for both OS families from bootstrap_node.yml; each task is gated on
# ansible_os_family so the right package manager / installer is used per host.
#
#   psutil  — python3 module required by the Salt process_collector
#             (salt/states/base/files/process_collector.py); feeds the
#             Processes tab. Installed on BOTH macOS and Linux.
#   macmon  — Apple-Silicon sudoless system monitor CLI (vladkens/macmon),
#             Homebrew only, macOS-only (no Linux equivalent).
#   tart    — cirruslabs/tart VM CLI; installing the binary has no runtime cost
#             (only running VMs consume resources). Powers the Virtual Machines
#             tab (`tart list`). Homebrew only, macOS-only.

# ── psutil: macOS ─────────────────────────────────────────────────────────────
# Install into the brew_user's per-user site via `python3 -m pip install --user`.
# Running as brew_user (not root) keeps it in a writable location regardless of
# how python3 is managed on the host (system, brew, or pyenv). failed_when:false
# keeps bootstrap resilient on hosts with an externally-managed python (PEP 668);
# the process_collector already tolerates a missing psutil at runtime.
- name: Check for python3 psutil (macOS)
  shell: python3 -c "import psutil" 2>/dev/null
  register: psutil_check_macos
  changed_when: false
  failed_when: false
  become: false
  become_user: "{{ brew_user }}"
  environment:
    PATH: "{{ brew_prefix }}/bin:/usr/local/bin:/usr/bin:/bin"
    HOME: "/Users/{{ brew_user }}"
  when: ansible_os_family == 'Darwin'

- name: Install python3 psutil via pip --user (macOS)
  shell: python3 -m pip install --user --upgrade psutil
  register: psutil_install_macos
  changed_when: "'Successfully installed' in psutil_install_macos.stdout"
  failed_when: false
  become: false
  become_user: "{{ brew_user }}"
  environment:
    PATH: "{{ brew_prefix }}/bin:/usr/local/bin:/usr/bin:/bin"
    HOME: "/Users/{{ brew_user }}"
  when: ansible_os_family == 'Darwin' and psutil_check_macos.rc != 0

# ── psutil: Linux (distro package) ────────────────────────────────────────────
- name: Install python3-psutil (Debian/Ubuntu)
  apt:
    name: python3-psutil
    state: present
    update_cache: true
  become: true
  failed_when: false
  when: ansible_os_family == 'Debian'

- name: Install python3-psutil (RHEL/Rocky)
  dnf:
    name: python3-psutil
    state: present
  become: true
  failed_when: false
  when: ansible_os_family == 'RedHat'

# ── macmon: macOS-only Homebrew CLI ───────────────────────────────────────────
- name: Check if macmon is installed (macOS)
  shell: "{{ brew_prefix }}/bin/brew list macmon >/dev/null 2>&1 && echo present || echo absent"
  register: macmon_check
  changed_when: false
  failed_when: false
  become: false
  become_user: "{{ brew_user }}"
  environment:
    PATH: "{{ brew_prefix }}/bin:/usr/local/bin:/usr/bin:/bin"
    HOME: "/Users/{{ brew_user }}"
  when: ansible_os_family == 'Darwin'

- name: Install macmon via Homebrew (macOS)
  shell: "{{ brew_prefix }}/bin/brew install macmon"
  register: macmon_install
  changed_when: "'already installed' not in macmon_install.stderr"
  failed_when: false
  become: false
  become_user: "{{ brew_user }}"
  environment:
    PATH: "{{ brew_prefix }}/bin:/usr/local/bin:/usr/bin:/bin"
    HOME: "/Users/{{ brew_user }}"
  when: ansible_os_family == 'Darwin' and macmon_check.stdout == 'absent'

# ── tart: macOS-only Homebrew CLI (cirruslabs/cli/tart) ───────────────────────
- name: Check if tart is installed (macOS)
  shell: "{{ brew_prefix }}/bin/brew list tart >/dev/null 2>&1 && echo present || echo absent"
  register: tart_check
  changed_when: false
  failed_when: false
  become: false
  become_user: "{{ brew_user }}"
  environment:
    PATH: "{{ brew_prefix }}/bin:/usr/local/bin:/usr/bin:/bin"
    HOME: "/Users/{{ brew_user }}"
  when: ansible_os_family == 'Darwin'

- name: Install tart via Homebrew (macOS)
  shell: "{{ brew_prefix }}/bin/brew install cirruslabs/cli/tart"
  register: tart_install
  changed_when: "'already installed' not in tart_install.stderr"
  failed_when: false
  become: false
  become_user: "{{ brew_user }}"
  environment:
    PATH: "{{ brew_prefix }}/bin:/usr/local/bin:/usr/bin:/bin"
    HOME: "/Users/{{ brew_user }}"
  when: ansible_os_family == 'Darwin' and tart_check.stdout == 'absent'
