---
# playbooks/tasks/host_prep_gate.yml
# Node-vantage master reachability gate (#536, epic #537). Checks that THIS
# NODE can reach each configured salt-master on ports 4505 (publish) and 4506
# (return) before the salt_minion role writes any minion config. A
# worker-side probe (salt_master_probe.py) tests control-plane reachability;
# this tests MINION-vantage reachability, which is what actually matters for
# Salt to function. Fails only when NONE of the masters are reachable on
# either port (same semantics as the previous per-master nc loops).

- name: Check TCP reachability to each salt-master on 4505/4506
  ansible.builtin.wait_for:
    host: "{{ item.0 }}"
    port: "{{ item.1 }}"
    timeout: 3
  loop: "{{ salt_masters | product([4505, 4506]) | list }}"
  loop_control:
    label: "{{ item.0 }}:{{ item.1 }}"
  register: master_port_results
  ignore_errors: true
  changed_when: false
  become: false

- name: Log master reachability from this node
  ansible.builtin.debug:
    msg: "Master {{ item.item.0 }} port {{ item.item.1 }}: {{ 'reachable' if not item.failed else 'UNREACHABLE' }}"
  loop: "{{ master_port_results.results }}"
  loop_control:
    label: "{{ item.item.0 }}:{{ item.item.1 }}"

- name: Fail if no salt-master is reachable from this node
  ansible.builtin.fail:
    msg: >-
      Target cannot reach any salt-master on 4505/4506 — check network/firewall.
      Masters probed: {{ salt_masters | join(', ') }}
  when: master_port_results.results | selectattr('failed') | list | length == master_port_results.results | length
