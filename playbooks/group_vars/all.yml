---
# playbooks/group_vars/all.yml
# Global defaults for all kri bootstrap playbooks.
# Override per-host in host_vars/<minion_id>.yml

# ── Salt version ──────────────────────────────────────────────────────────────
# Pinned to match the kri salt-master (hellodk/salt-master:3008.0 installs 3008.x).
# Change here to upgrade fleet-wide; always test on one node first.
# Salt 3007.x minions are backward-compatible with 3008.x master.
salt_version: "3007.14"

# Salt pkg filename pattern: salt-<version>-py3-<arch>.pkg
# arm64 = Apple Silicon, x86_64 = Intel
salt_pkg_arm64: "salt-{{ salt_version }}-py3-arm64.pkg"
salt_pkg_x86_64: "salt-{{ salt_version }}-py3-x86_64.pkg"

# Checksum file (SHA512) published alongside the pkg by Salt Project
salt_pkg_checksum_arm64: "salt-{{ salt_version }}-py3-arm64.pkg.sha512"
salt_pkg_checksum_x86_64: "salt-{{ salt_version }}-py3-x86_64.pkg.sha512"

# ── Download sources ──────────────────────────────────────────────────────────
# Primary: Artifactory binary repo (air-gap / on-prem mirror).
# Set artifactory_binary_url in host_vars or pass via -e to override.
# If empty, falls through to the official Salt Project URL.
artifactory_binary_url: ""   # e.g. https://artifactory.company.local/binary-repo

# Official Salt Project download URL (internet required)
salt_pkg_official_base: "https://packages.broadcom.com/artifactory/saltproject-generic/onedir/{{ salt_version }}"

# ── Linux salt package repos (used by bootstrap_node.yml + salt_master role) ─
# Mirror the salt_master role defaults so bootstrap works without the role.
salt_deb_repo_url: "https://packages.broadcom.com/artifactory/saltproject-deb/"
salt_deb_gpg_url: "https://packages.broadcom.com/artifactory/api/security/keypair/SaltProjectKey/public"
salt_rpm_repo_baseurl: "https://packages.broadcom.com/artifactory/saltproject-rpm/"
salt_rpm_gpg_url: "https://packages.broadcom.com/artifactory/api/security/keypair/SaltProjectKey/public"

# ── Salt master ───────────────────────────────────────────────────────────────
# salt-master runs natively on mm1 (100.102.68.75) — NOT in Docker.
# This eliminates PKI key rotation on every kri deploy.
salt_master_address: "100.102.68.75"   # mm1 Tailscale IP
# salt_master_pub_key: set in host_vars/ or passed via -e at runtime
# contents of /etc/salt/pki/master/master.pub on mm1 after role apply
#   -----BEGIN PUBLIC KEY-----
#   ...
#   -----END PUBLIC KEY-----

# ── Homebrew ──────────────────────────────────────────────────────────────────
brew_prefix_arm64: /opt/homebrew
brew_prefix_x86: /usr/local

# ── node_exporter ─────────────────────────────────────────────────────────────
node_exporter_version: "1.8.2"
# Artifactory mirror (air-gap); falls back to official GitHub release when
# artifactory_binary_url is empty.
# Layout: <artifactory_binary_url>/node_exporter/<version>/<tarball>
node_exporter_official_base: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}"
