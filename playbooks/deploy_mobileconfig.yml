---
# Deploy or remove a macOS configuration profile on target nodes.
# Run from kri Automation Hub or directly:
#   ansible-playbook playbooks/deploy_mobileconfig.yml \
#     -e "mobileconfig_action=install" \
#     -e "mobileconfig_xml=<xml>" \
#     -e "mobileconfig_profile_uuid=<uuid>"
- name: Manage macOS configuration profile
  hosts: targets
  gather_facts: false
  roles:
    - mobileconfig
