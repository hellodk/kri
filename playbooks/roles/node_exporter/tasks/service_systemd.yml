---
# playbooks/roles/node_exporter/tasks/service_systemd.yml
# Dedicated system user/group + systemd unit for node_exporter (Linux only).

- name: Create node_exporter system group
  ansible.builtin.group:
    name: "{{ node_exporter_user }}"
    system: true
  become: true

- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    group: "{{ node_exporter_user }}"
  become: true

- name: Install node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  become: true
  notify: Restart node_exporter (systemd)

- name: Enable and start node_exporter via systemd
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
  become: true
