---
- name: Check if node_exporter already running on port 9100
  command: lsof -i :9100 -t
  register: port_check
  changed_when: false
  failed_when: false

- name: Skip if already running
  meta: end_play
  when: port_check.rc == 0 and port_check.stdout != ""

- name: Download node_exporter binary for macOS (arm64)
  get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.darwin-arm64.tar.gz"
    dest: "/tmp/node_exporter.tar.gz"
    mode: '0644'

- name: Extract node_exporter
  unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /tmp/
    remote_src: yes

- name: Install node_exporter binary
  copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.darwin-arm64/node_exporter"
    dest: "{{ node_exporter_install_dir }}/node_exporter"
    mode: '0755'
    remote_src: yes
  become: true

- name: Create launchd plist for node_exporter
  copy:
    dest: /Library/LaunchDaemons/io.prometheus.node_exporter.plist
    mode: '0644'
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
        <key>Label</key>
        <string>io.prometheus.node_exporter</string>
        <key>ProgramArguments</key>
        <array>
          <string>{{ node_exporter_install_dir }}/node_exporter</string>
          <string>--web.listen-address=:{{ node_exporter_port }}</string>
        </array>
        <key>RunAtLoad</key>
        <true/>
        <key>KeepAlive</key>
        <true/>
        <key>StandardErrorPath</key>
        <string>/var/log/node_exporter.log</string>
        <key>StandardOutPath</key>
        <string>/var/log/node_exporter.log</string>
      </dict>
      </plist>
  become: true

- name: Load and start node_exporter service
  command: launchctl load /Library/LaunchDaemons/io.prometheus.node_exporter.plist
  become: true
  ignore_errors: true

- name: Verify node_exporter responds on port 9100
  uri:
    url: "http://localhost:{{ node_exporter_port }}/metrics"
    status_code: 200
  retries: 5
  delay: 3
