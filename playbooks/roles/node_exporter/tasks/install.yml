---
# playbooks/roles/node_exporter/tasks/install.yml
# Version-gated download + install of the node_exporter binary. Shared by Linux and
# macOS — ne_os/ne_arch are set by tasks/main.yml before this is included. Mirrors
# playbooks/tasks/bootstrap/node_exporter_{linux,macos}.yml so both flows stay
# drift-free.

- name: Set node_exporter tarball name
  ansible.builtin.set_fact:
    ne_tarball: "node_exporter-{{ node_exporter_version }}.{{ ne_os }}-{{ ne_arch }}.tar.gz"

# Resolution precedence: node_exporter_url_override > artifactory_binary_url +
# artifactory_node_exporter_path > node_exporter_official_base.
- name: Resolve node_exporter download URL
  ansible.builtin.set_fact:
    ne_download_url: >-
      {%- if node_exporter_url_override -%}{{ node_exporter_url_override }}
      {%- elif artifactory_binary_url -%}{{ artifactory_binary_url.rstrip('/') }}/{{ artifactory_node_exporter_path }}/{{ ne_tarball }}
      {%- else -%}{{ node_exporter_official_base }}/{{ ne_tarball }}
      {%- endif -%}

- name: Resolve node_exporter checksum manifest URL
  ansible.builtin.set_fact:
    ne_checksum_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/sha256sums"

- name: Check existing node_exporter version
  ansible.builtin.shell: /usr/local/bin/node_exporter --version 2>&1 | head -1 | awk '{print $3}'
  register: ne_installed_version
  failed_when: false
  changed_when: false
  become: false

- name: Download node_exporter tarball (checksum-verified)
  ansible.builtin.get_url:
    url: "{{ ne_download_url }}"
    dest: "/tmp/{{ ne_tarball }}"
    checksum: "sha256:{{ ne_checksum_url }}"
    mode: "0644"
  become: false
  when: ne_installed_version.stdout.strip() != node_exporter_version

- name: Extract and install node_exporter binary
  ansible.builtin.shell: |
    tar -xzf /tmp/{{ ne_tarball }} -C /tmp
    cp /tmp/node_exporter-{{ node_exporter_version }}.{{ ne_os }}-{{ ne_arch }}/node_exporter {{ node_exporter_install_dir }}/node_exporter
    chmod 0755 {{ node_exporter_install_dir }}/node_exporter
  become: true
  when: ne_installed_version.stdout.strip() != node_exporter_version
