---
# playbooks/roles/node_exporter/tasks/install.yml
# Version-gated, AIR-GAPPED install of the node_exporter binary. Shared by Linux and
# macOS — ne_os/ne_arch are set by tasks/main.yml before this is included. Mirrors
# the salt_minion air-gap (#966): the pinned tarball + its .sha256 are bundled under
# playbooks/files/ and COPIED to the target — nothing is downloaded at runtime. The
# bundled checksum is validated against the copied tarball before install.
# Only the darwin/arm64 tarball is bundled today; other os/arch is a follow-up (#696).

- name: Set node_exporter tarball name
  ansible.builtin.set_fact:
    ne_tarball: "node_exporter-{{ node_exporter_version }}.{{ ne_os }}-{{ ne_arch }}.tar.gz"

- name: Check existing node_exporter version
  ansible.builtin.shell: /usr/local/bin/node_exporter --version 2>&1 | head -1 | awk '{print $3}'
  register: ne_installed_version
  failed_when: false
  changed_when: false
  become: false

# Copy the bundled tarball + checksum from playbooks/files/ (air-gap; no download).
- name: Copy bundled node_exporter checksum to target
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/{{ ne_tarball }}.sha256"
    dest: "/tmp/{{ ne_tarball }}.sha256"
    mode: "0644"
  become: false
  when: ne_installed_version.stdout.strip() != node_exporter_version

- name: Copy bundled node_exporter tarball to target
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/{{ ne_tarball }}"
    dest: "/tmp/{{ ne_tarball }}"
    mode: "0644"
  become: false
  when: ne_installed_version.stdout.strip() != node_exporter_version

- name: Verify node_exporter tarball checksum
  ansible.builtin.shell: |
    EXPECTED=$(cat /tmp/{{ ne_tarball }}.sha256 | awk '{print $1}')
    ACTUAL=$(shasum -a 256 /tmp/{{ ne_tarball }} | awk '{print $1}')
    if [ "$EXPECTED" != "$ACTUAL" ]; then
      echo "CHECKSUM MISMATCH: expected $EXPECTED got $ACTUAL" >&2
      exit 1
    fi
    echo "Checksum OK: $ACTUAL"
  changed_when: false
  when: ne_installed_version.stdout.strip() != node_exporter_version

- name: Extract and install node_exporter binary
  ansible.builtin.shell: |
    tar -xzf /tmp/{{ ne_tarball }} -C /tmp
    cp /tmp/node_exporter-{{ node_exporter_version }}.{{ ne_os }}-{{ ne_arch }}/node_exporter {{ node_exporter_install_dir }}/node_exporter
    chmod 0755 {{ node_exporter_install_dir }}/node_exporter
  become: true
  when: ne_installed_version.stdout.strip() != node_exporter_version
