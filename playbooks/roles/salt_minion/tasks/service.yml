---
# playbooks/roles/salt_minion/tasks/service.yml
# Start salt-minion (launchd macOS / systemd Linux) and verify it is running.
#
# #972: verification uses `pgrep`, NOT the service_facts module — its launchd/BSD
# provider does not reliably populate the gathered services fact on macOS, which
# raised "object of type 'dict' has no attribute 'services'" and failed bootstrap.
# pgrep confirms the real process on both macOS and Linux; the until/retries loop
# covers the post-start race that a raw `ps | grep` would be vulnerable to.

- name: Load salt-minion launchd service (macOS)
  shell: launchctl load -w /Library/LaunchDaemons/com.saltstack.salt.minion.plist 2>/dev/null || true
  become: true
  changed_when: false
  when: ansible_os_family == 'Darwin'

- name: Start salt-minion service (macOS)
  shell: launchctl start com.saltstack.salt.minion 2>/dev/null || true
  become: true
  changed_when: false
  when: ansible_os_family == 'Darwin'

- name: Enable and start salt-minion via systemd (Linux)
  ansible.builtin.systemd:
    name: salt-minion
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: ansible_os_family in ['Debian', 'RedHat']

# Re-runs pgrep on each retry (the `until` re-evaluates the whole task) until the
# salt-minion process appears. The [s]alt-minion bracket avoids matching pgrep's
# own shell command line. Works identically on macOS (launchd) and Linux (systemd).
- name: Verify salt-minion process is running
  ansible.builtin.shell: pgrep -f "[s]alt-minion" >/dev/null 2>&1 && echo running || echo down
  register: salt_minion_proc
  until: "'running' in salt_minion_proc.stdout"
  retries: 6
  delay: 5
  changed_when: false
  failed_when: false
  become: false

- name: Fail if salt-minion did not start
  ansible.builtin.fail:
    msg: >-
      salt-minion is not running after ~30s — check the minion log
      (/var/log/salt/minion) and the service (launchctl/systemctl) on the node.
  when: "'running' not in (salt_minion_proc.stdout | default('down'))"
