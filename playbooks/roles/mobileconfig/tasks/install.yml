---
- name: Write profile to temp file
  copy:
    content: "{{ mobileconfig_xml }}"
    dest: "/tmp/kri_profile_{{ mobileconfig_profile_uuid }}.mobileconfig"
    mode: '0600'

- name: Install profile
  command: "profiles install -path /tmp/kri_profile_{{ mobileconfig_profile_uuid }}.mobileconfig"
  become: true
  register: install_result

- name: Verify profile installed
  command: "profiles list"
  register: profiles_list
  changed_when: false

- name: Assert UUID present
  assert:
    that: mobileconfig_profile_uuid in profiles_list.stdout
    fail_msg: "Profile {{ mobileconfig_profile_uuid }} not found after install"

- name: Remove temp file
  file:
    path: "/tmp/kri_profile_{{ mobileconfig_profile_uuid }}.mobileconfig"
    state: absent
