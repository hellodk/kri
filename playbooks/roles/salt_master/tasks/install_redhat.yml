---
# tasks/install_redhat.yml — install salt-master on RHEL/Rocky/Alma via dnf
- name: Add Salt project dnf repo
  yum_repository:
    name: salt
    description: Salt repo
    baseurl: "{{ salt_rpm_repo_baseurl }}"
    gpgcheck: true
    gpgkey: "{{ salt_rpm_gpg_url }}"
    enabled: true
  become: true

- name: Install salt-master and salt-api
  dnf:
    name:
      - "salt-master-{{ salt_version }}"
      - "salt-api-{{ salt_version }}"
    state: present
  become: true
