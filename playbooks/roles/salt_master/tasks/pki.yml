---
# tasks/pki.yml — transfer PKI keys from Ansible controller to mm1
# The controller (Linux host running the playbook) has deploy/salt-pki/
# which contains the current salt-master keys and accepted minion keys.

- name: Create PKI directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: wheel
    mode: "0700"
  loop:
    - "{{ salt_pki_dir }}"
    - "{{ salt_pki_dir }}/minions"
    - "{{ salt_pki_dir }}/minions_pre"
    - "{{ salt_pki_dir }}/minions_denied"
    - "{{ salt_pki_dir }}/minions_autosign"
    - "{{ salt_pki_dir }}/minions_rejected"
  become: true

# A pre-provisioned master keypair (deploy/salt-pki/) gives the master a STABLE
# identity across reinstalls, so minions never need to re-accept its key. If it
# doesn't exist on the controller (fresh install), skip these — salt-master
# generates its own master.pem/master.pub automatically on first start.
# Read the pre-provisioned controller keys (if any) on localhost.
# become:false here on purpose — the controller may be a container without sudo
# (the kri worker), and there are no keys to read there anyway. When run from a
# host that DOES have a pre-provisioned root-owned key (e.g. cylon), invoke the
# playbook itself as root (sudo -E ansible-playbook) so this read sees it.
# copy:src= could not read a root-owned local file at all (its action plugin
# reads the src as the launching user, never elevated), hence slurp→content.
- name: Check for a pre-provisioned master keypair on the controller
  stat:
    path: "{{ playbook_dir }}/../deploy/salt-pki/master.pem"
    follow: true   # master.pem is a symlink to a versioned file — resolve it so
                   # stat.exists reflects the real target (a dangling link → false,
                   # so the slurp/copy skip and salt-master self-generates instead)
  delegate_to: localhost
  become: false
  register: _master_pem
  # Best-effort: a root-owned (0700) deploy/salt-pki/ that the launching user
  # cannot traverse must NOT hard-fail the whole master install. When the stat
  # can't read the path, treat it as "no pre-provisioned key" and skip the push;
  # the target keeps whatever master keypair it already has (a reinstall on a
  # host with an existing stable key), or salt-master self-generates on first
  # start (a truly fresh host). To actively push the controller's canonical
  # keypair, run the playbook as root (sudo -E ansible-playbook) so this read
  # can see the root-owned file.
  failed_when: false

- name: Read master private key from controller
  slurp:
    src: "{{ playbook_dir }}/../deploy/salt-pki/master.pem"
  delegate_to: localhost
  become: false
  register: _master_pem_content
  when: _master_pem.stat.exists | default(false)

- name: Read master public key from controller
  slurp:
    src: "{{ playbook_dir }}/../deploy/salt-pki/master.pub"
  delegate_to: localhost
  become: false
  register: _master_pub_content
  when: _master_pem.stat.exists | default(false)

- name: Install master private key on target
  copy:
    content: "{{ _master_pem_content.content | b64decode }}"
    dest: "{{ salt_pki_dir }}/master.pem"
    owner: root
    group: wheel
    mode: "0400"
  when: _master_pem.stat.exists | default(false)

- name: Install master public key on target
  copy:
    content: "{{ _master_pub_content.content | b64decode }}"
    dest: "{{ salt_pki_dir }}/master.pub"
    owner: root
    group: wheel
    mode: "0444"
  when: _master_pem.stat.exists | default(false)

- name: Copy accepted minion keys
  copy:
    src: "{{ playbook_dir }}/../deploy/salt-pki/minions/"
    dest: "{{ salt_pki_dir }}/minions/"
    owner: root
    group: wheel
    mode: "0644"
  become: true
  when: lookup('fileglob', playbook_dir + '/../deploy/salt-pki/minions/*') | length > 0

- name: Fix PKI directory permissions (755 so API can read key lists)
  file:
    path: "{{ item }}"
    mode: "0755"
  loop:
    - "{{ salt_pki_dir }}"
    - "{{ salt_pki_dir }}/minions"
    - "{{ salt_pki_dir }}/minions_pre"
    - "{{ salt_pki_dir }}/minions_rejected"
    - "{{ salt_pki_dir }}/minions_denied"
  become: true
