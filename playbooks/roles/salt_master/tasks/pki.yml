---
# tasks/pki.yml — transfer PKI keys from Ansible controller to mm1
# The controller (Linux host running the playbook) has deploy/salt-pki/
# which contains the current salt-master keys and accepted minion keys.

- name: Create PKI directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: wheel
    mode: "0700"
  loop:
    - "{{ salt_pki_dir }}"
    - "{{ salt_pki_dir }}/minions"
    - "{{ salt_pki_dir }}/minions_pre"
    - "{{ salt_pki_dir }}/minions_denied"
    - "{{ salt_pki_dir }}/minions_autosign"
    - "{{ salt_pki_dir }}/minions_rejected"
  become: true

# A pre-provisioned master keypair (deploy/salt-pki/) gives the master a STABLE
# identity across reinstalls, so minions never need to re-accept its key. If it
# doesn't exist on the controller (fresh install), skip these — salt-master
# generates its own master.pem/master.pub automatically on first start.
# Read the (root-owned) controller keys via slurp on localhost — become reads
# them as root on the controller. `copy: src=` could NOT do this: the copy action
# plugin reads a local src as the unprivileged ansible user, never via become.
- name: Check for a pre-provisioned master keypair on the controller
  stat:
    path: "{{ playbook_dir }}/../deploy/salt-pki/master.pem"
  delegate_to: localhost
  register: _master_pem

- name: Read master private key from controller (privileged)
  slurp:
    src: "{{ playbook_dir }}/../deploy/salt-pki/master.pem"
  delegate_to: localhost
  register: _master_pem_content
  when: _master_pem.stat.exists

- name: Read master public key from controller (privileged)
  slurp:
    src: "{{ playbook_dir }}/../deploy/salt-pki/master.pub"
  delegate_to: localhost
  register: _master_pub_content
  when: _master_pem.stat.exists

- name: Install master private key on target
  copy:
    content: "{{ _master_pem_content.content | b64decode }}"
    dest: "{{ salt_pki_dir }}/master.pem"
    owner: root
    group: wheel
    mode: "0400"
  when: _master_pem.stat.exists

- name: Install master public key on target
  copy:
    content: "{{ _master_pub_content.content | b64decode }}"
    dest: "{{ salt_pki_dir }}/master.pub"
    owner: root
    group: wheel
    mode: "0444"
  when: _master_pem.stat.exists

- name: Copy accepted minion keys
  copy:
    src: "{{ playbook_dir }}/../deploy/salt-pki/minions/"
    dest: "{{ salt_pki_dir }}/minions/"
    owner: root
    group: wheel
    mode: "0644"
  become: true
  when: lookup('fileglob', playbook_dir + '/../deploy/salt-pki/minions/*') | length > 0

- name: Fix PKI directory permissions (755 so API can read key lists)
  file:
    path: "{{ item }}"
    mode: "0755"
  loop:
    - "{{ salt_pki_dir }}"
    - "{{ salt_pki_dir }}/minions"
    - "{{ salt_pki_dir }}/minions_pre"
    - "{{ salt_pki_dir }}/minions_rejected"
    - "{{ salt_pki_dir }}/minions_denied"
  become: true
