---
# tasks/install_linux_onedir.yml — install salt-master from the bundled Linux
# onedir tarball (AIR-GAPPED).
#
# The pinned onedir tarball + its .sha256 are bundled under playbooks/files/
# and copied straight to the target — nothing is downloaded from Artifactory
# or the internet (#970, mirrors the macOS air-gap pattern from #966).
#
# The onedir tarball expands to /opt/saltstack/salt/ which puts all Salt
# binaries under /opt/saltstack/salt/bin/. A symlink pass puts salt-master,
# salt-key, and salt-api on PATH under /usr/local/bin.
#
# Only linux-x86_64 is bundled today; other arches are a follow-up.

- name: Set Linux onedir tarball facts
  set_fact:
    salt_linux_tarball: "{{ salt_linux_tarball_name }}"
    salt_linux_tarball_local_path: "{{ playbook_dir }}/files/{{ salt_linux_tarball_name }}"

- name: Check if salt onedir is already installed at target version
  shell: |
    if [ -f /opt/saltstack/salt/bin/salt-master ]; then
      /opt/saltstack/salt/bin/salt-master --version 2>/dev/null | awk '{print $2}'
    fi
  register: installed_onedir_version
  changed_when: false
  failed_when: false
  become: false

- name: Show installed onedir version
  debug:
    msg: >-
      salt onedir {{ installed_onedir_version.stdout | trim or 'not installed' }}
      — target: {{ salt_version }}
      — will install: {{ installed_onedir_version.stdout | trim != salt_version }}

# ── Deploy bundled tarball to target (air-gap; no download) ──────────────────

- name: Copy bundled salt onedir tarball to target
  copy:
    src: "{{ salt_linux_tarball_local_path }}"
    dest: "/tmp/{{ salt_linux_tarball }}"
    mode: "0644"
  become: false
  when: installed_onedir_version.stdout | trim != salt_version
  timeout: 300

- name: Copy bundled salt onedir tarball sha256 to target
  copy:
    src: "{{ salt_linux_tarball_local_path }}.sha256"
    dest: "/tmp/{{ salt_linux_tarball }}.sha256"
    mode: "0644"
  become: false
  when: installed_onedir_version.stdout | trim != salt_version

- name: Verify tarball sha256 before extract
  shell: |
    EXPECTED=$(awk '{print $1}' /tmp/{{ salt_linux_tarball }}.sha256)
    if command -v sha256sum >/dev/null 2>&1; then
      ACTUAL=$(sha256sum /tmp/{{ salt_linux_tarball }} | awk '{print $1}')
    else
      ACTUAL=$(shasum -a 256 /tmp/{{ salt_linux_tarball }} | awk '{print $1}')
    fi
    if [ "$EXPECTED" != "$ACTUAL" ]; then
      echo "CHECKSUM MISMATCH: expected $EXPECTED got $ACTUAL" >&2; exit 1
    fi
    echo "Checksum OK: $ACTUAL"
  when: installed_onedir_version.stdout | trim != salt_version
  changed_when: false

- name: Create onedir install directory
  file:
    path: /opt/saltstack
    state: directory
    mode: "0755"
  become: true
  when: installed_onedir_version.stdout | trim != salt_version

- name: Extract salt onedir tarball
  shell: tar -xJf /tmp/{{ salt_linux_tarball }} -C /opt/saltstack
  become: true
  when: installed_onedir_version.stdout | trim != salt_version

- name: Create /usr/local/bin symlinks for salt binaries
  file:
    src: "/opt/saltstack/salt/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  become: true
  loop:
    - salt-master
    - salt-minion
    - salt-key
    - salt-api
    - salt-call
    - salt-run
  when: installed_onedir_version.stdout | trim != salt_version

- name: Clean up tmp files
  shell: "rm -f /tmp/{{ salt_linux_tarball }} /tmp/{{ salt_linux_tarball }}.sha256"
  become: false
  changed_when: false
  when: installed_onedir_version.stdout | trim != salt_version

- name: Confirm salt onedir installed at target version
  shell: /opt/saltstack/salt/bin/salt-master --version 2>/dev/null | awk '{print $2}'
  register: post_install_onedir_version
  changed_when: false
  failed_when: salt_version not in (post_install_onedir_version.stdout | default(''))
  when: installed_onedir_version.stdout | trim != salt_version

- name: Show installed onedir version
  debug:
    msg: "salt onedir {{ post_install_onedir_version.stdout | trim }} installed"
  when:
    - installed_onedir_version.stdout | trim != salt_version
    - post_install_onedir_version is defined
