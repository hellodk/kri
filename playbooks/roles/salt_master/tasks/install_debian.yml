---
# tasks/install_debian.yml — install salt-master on Debian/Ubuntu via apt
- name: Ensure keyrings dir exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Add Salt project repo key
  get_url:
    url: "{{ salt_deb_gpg_url }}"
    dest: /etc/apt/keyrings/salt-archive-keyring.pgp
    mode: "0644"
  become: true

- name: Add Salt apt source
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/salt-archive-keyring.pgp] {{ salt_deb_repo_url }} stable main"
    filename: salt
    state: present
  become: true

- name: Install salt-master and salt-api
  apt:
    name:
      - "salt-master={{ salt_version }}*"
      - "salt-api={{ salt_version }}*"
    update_cache: true
    state: present
  become: true
