---
# tasks/install_debian.yml — install salt-master on Debian/Ubuntu via apt
- name: Ensure keyrings dir exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Add Salt project repo key
  get_url:
    url: https://packages.broadcom.com/artifactory/api/security/keypair/SaltProjectKey/public
    dest: /etc/apt/keyrings/salt-archive-keyring.pgp
    mode: "0644"
  become: true

- name: Add Salt apt source
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/salt-archive-keyring.pgp] https://packages.broadcom.com/artifactory/saltproject-deb/ stable main"
    filename: salt
    state: present
  become: true

- name: Install salt-master
  apt:
    name: "salt-master={{ salt_version }}*"
    update_cache: true
    state: present
  become: true
