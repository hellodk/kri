---
# tasks/install.yml — install salt-master from Artifactory or local bundle
#
# Download priority:
#   1. Artifactory mirror (artifactory_binary_url set) — fastest, no internet on target
#   2. Local bundle  (playbooks/files/*.pkg)          — air-gapped fallback
#   3. Official URL  (salt_pkg_official_base)         — requires internet on controller
#
# The target node never needs internet access — the controller downloads and copies via SSH.

- name: Set pkg filename
  set_fact:
    salt_pkg_filename: "salt-{{ salt_version }}-py3-arm64.pkg"
    salt_pkg_local_path: "{{ playbook_dir }}/files/salt-{{ salt_version }}-py3-arm64.pkg"
    salt_pkg_tmp: "/tmp/kri-salt-{{ salt_version }}-py3-arm64.pkg"

- name: Check if correct salt-master version is already installed
  shell: /opt/salt/salt-master --version 2>/dev/null | awk '{print $2}'
  args:
    executable: "{{ ansible_shell_executable | default('/bin/bash') }}"
  register: installed_salt_version
  changed_when: false
  failed_when: false
  become: false

- name: Show installed version
  debug:
    msg: >-
      salt-master {{ installed_salt_version.stdout | trim or 'not installed' }}
      — target: {{ salt_version }}
      — will install: {{ installed_salt_version.stdout | trim != salt_version }}

# ── Source 1: Artifactory ────────────────────────────────────────────────────

- name: Download salt .pkg from Artifactory
  get_url:
    url: "{{ artifactory_binary_url }}/{{ salt_pkg_filename }}"
    dest: "{{ salt_pkg_tmp }}"
    mode: "0644"
    timeout: 60
    validate_certs: false
  delegate_to: localhost
  become: false
  register: artifactory_download
  when:
    - installed_salt_version.stdout | trim != salt_version
    - artifactory_binary_url | length > 0
  ignore_errors: true

# ── Source 2: Local bundle (air-gapped fallback) ─────────────────────────────

- name: Check if local bundle exists on controller
  local_action: stat path="{{ salt_pkg_local_path }}"
  register: pkg_stat
  become: false
  when:
    - installed_salt_version.stdout | trim != salt_version
    - artifactory_download is skipped or artifactory_download is failed

- name: Use local bundle (copy to tmp on controller)
  copy:
    src: "{{ salt_pkg_local_path }}"
    dest: "{{ salt_pkg_tmp }}"
    mode: "0644"
  delegate_to: localhost
  become: false
  when:
    - installed_salt_version.stdout | trim != salt_version
    - artifactory_download is skipped or artifactory_download is failed
    - pkg_stat.stat is defined and pkg_stat.stat.exists

# ── Source 3: Official URL (requires internet on controller) ─────────────────

- name: Download salt .pkg from official URL (last resort)
  get_url:
    url: "{{ salt_pkg_official_base }}/{{ salt_pkg_filename }}"
    dest: "{{ salt_pkg_tmp }}"
    mode: "0644"
    timeout: 120
  delegate_to: localhost
  become: false
  when:
    - installed_salt_version.stdout | trim != salt_version
    - artifactory_download is skipped or artifactory_download is failed
    - pkg_stat.stat is not defined or not pkg_stat.stat.exists

# ── Verify pkg is ready ───────────────────────────────────────────────────────

- name: Verify pkg exists on controller before copying to target
  local_action: stat path="{{ salt_pkg_tmp }}"
  register: pkg_ready
  become: false
  failed_when: not pkg_ready.stat.exists
  when: installed_salt_version.stdout | trim != salt_version

# ── Deploy to target ──────────────────────────────────────────────────────────

- name: Copy salt .pkg to target via SSH
  copy:
    src: "{{ salt_pkg_tmp }}"
    dest: "/tmp/{{ salt_pkg_filename }}"
    mode: "0644"
  become: false
  when: installed_salt_version.stdout | trim != salt_version
  timeout: 120

- name: Copy sha512 checksum file to target (if present)
  copy:
    src: "{{ salt_pkg_local_path }}.sha512"
    dest: "/tmp/{{ salt_pkg_filename }}.sha512"
    mode: "0644"
  become: false
  when: installed_salt_version.stdout | trim != salt_version
  failed_when: false

- name: Verify pkg sha512 before install
  shell: |
    if [ -f /tmp/{{ salt_pkg_filename }}.sha512 ]; then
      EXPECTED=$(awk '{print $1}' /tmp/{{ salt_pkg_filename }}.sha512)
      ACTUAL=$(shasum -a 512 /tmp/{{ salt_pkg_filename }} | awk '{print $1}')
      if [ "$EXPECTED" != "$ACTUAL" ]; then
        echo "CHECKSUM MISMATCH" >&2; exit 1
      fi
    fi
    echo "ok"
  args:
    executable: "{{ ansible_shell_executable | default('/bin/bash') }}"
  when: installed_salt_version.stdout | trim != salt_version
  changed_when: false

- name: Stop existing salt-master (if running) before install
  shell: /bin/launchctl stop com.saltstack.salt.master 2>/dev/null; true
  args:
    executable: "{{ ansible_shell_executable | default('/bin/bash') }}"
  become: true
  changed_when: false
  when: installed_salt_version.stdout | trim != salt_version

- name: Install salt .pkg
  shell: /usr/sbin/installer -pkg /tmp/{{ salt_pkg_filename }} -target /
  args:
    executable: "{{ ansible_shell_executable | default('/bin/bash') }}"
  become: true
  when: installed_salt_version.stdout | trim != salt_version
  timeout: 300

- name: Clean up tmp files
  shell: rm -f /tmp/{{ salt_pkg_filename }} /tmp/{{ salt_pkg_filename }}.sha512 {{ salt_pkg_tmp }}
  args:
    executable: "{{ ansible_shell_executable | default('/bin/bash') }}"
  delegate_to: localhost
  become: false
  changed_when: false
  when: installed_salt_version.stdout | trim != salt_version

- name: Confirm salt-master binary exists after install
  shell: /opt/salt/salt-master --version 2>/dev/null
  args:
    executable: "{{ ansible_shell_executable | default('/bin/bash') }}"
  register: post_install_version
  changed_when: false
  failed_when: salt_version not in post_install_version.stdout
  when: installed_salt_version.stdout | trim != salt_version

- name: Show installed version
  debug:
    msg: "salt-master {{ post_install_version.stdout | trim }} installed"
  when:
    - installed_salt_version.stdout | trim != salt_version
    - post_install_version is defined
