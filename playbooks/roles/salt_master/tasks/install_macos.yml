---
# tasks/install_macos.yml — install salt-master from the bundled pkg (AIR-GAPPED).
#
# The pinned pkg + its .sha512 are bundled under playbooks/files/ and copied
# straight to the target — nothing is downloaded from Artifactory or the internet
# (#966/#696). Only the arm64 macOS pkg is bundled today.

- name: Set pkg filename
  set_fact:
    salt_pkg_filename: "salt-{{ salt_version }}-py3-arm64.pkg"
    salt_pkg_local_path: "{{ playbook_dir }}/files/salt-{{ salt_version }}-py3-arm64.pkg"

# NOTE: do NOT use `/opt/salt/salt-master --version` for detection — on the
# macOS onedir build it prints the version then continues booting the daemon
# (never reaches EOF), so a piped `| awk` hangs until ANSIBLE_TASK_TIMEOUT.
# pkgutil reads the installed .pkg receipt and exits cleanly+instantly.
- name: Check if correct salt-master version is already installed
  shell: pkgutil --pkg-info com.saltstack.salt 2>/dev/null | awk '/^version:/ {print $2}'
  args:
    executable: "{{ ansible_shell_executable | default('/bin/bash') }}"
  register: installed_salt_version
  changed_when: false
  failed_when: false
  become: false

- name: Show installed version
  debug:
    msg: >-
      salt-master {{ installed_salt_version.stdout | trim or 'not installed' }}
      — target: {{ salt_version }}
      — will install: {{ installed_salt_version.stdout | trim != salt_version }}

# ── Deploy bundled pkg to target (air-gap; no download) ──────────────────────

- name: Copy bundled salt .pkg to target
  copy:
    src: "{{ salt_pkg_local_path }}"
    dest: "/tmp/{{ salt_pkg_filename }}"
    mode: "0644"
  become: false
  when: installed_salt_version.stdout | trim != salt_version
  timeout: 120

- name: Copy bundled salt .pkg sha512 to target
  copy:
    src: "{{ salt_pkg_local_path }}.sha512"
    dest: "/tmp/{{ salt_pkg_filename }}.sha512"
    mode: "0644"
  become: false
  when: installed_salt_version.stdout | trim != salt_version

- name: Verify pkg sha512 before install
  shell: |
    if [ -f /tmp/{{ salt_pkg_filename }}.sha512 ]; then
      EXPECTED=$(awk '{print $1}' /tmp/{{ salt_pkg_filename }}.sha512)
      ACTUAL=$(shasum -a 512 /tmp/{{ salt_pkg_filename }} | awk '{print $1}')
      if [ "$EXPECTED" != "$ACTUAL" ]; then
        echo "CHECKSUM MISMATCH" >&2; exit 1
      fi
    fi
    echo "ok"
  args:
    executable: "{{ ansible_shell_executable | default('/bin/bash') }}"
  when: installed_salt_version.stdout | trim != salt_version
  changed_when: false

- name: Stop existing salt-master (if running) before install
  shell: /bin/launchctl stop com.saltstack.salt.master 2>/dev/null; true
  args:
    executable: "{{ ansible_shell_executable | default('/bin/bash') }}"
  become: true
  changed_when: false
  when: installed_salt_version.stdout | trim != salt_version

- name: Install salt .pkg
  shell: /usr/sbin/installer -pkg /tmp/{{ salt_pkg_filename }} -target /
  args:
    executable: "{{ ansible_shell_executable | default('/bin/bash') }}"
  become: true
  when: installed_salt_version.stdout | trim != salt_version
  timeout: 300

- name: Clean up tmp files
  shell: rm -f /tmp/{{ salt_pkg_filename }} /tmp/{{ salt_pkg_filename }}.sha512
  args:
    executable: "{{ ansible_shell_executable | default('/bin/bash') }}"
  delegate_to: localhost
  become: false
  changed_when: false
  when: installed_salt_version.stdout | trim != salt_version

# Use pkgutil (clean exit) instead of `salt-master --version` (boots daemon → hangs).
- name: Confirm salt-master installed at the target version
  shell: pkgutil --pkg-info com.saltstack.salt 2>/dev/null | awk '/^version:/ {print $2}'
  args:
    executable: "{{ ansible_shell_executable | default('/bin/bash') }}"
  register: post_install_version
  changed_when: false
  failed_when: salt_version not in post_install_version.stdout
  when: installed_salt_version.stdout | trim != salt_version

- name: Show installed version
  debug:
    msg: "salt-master {{ post_install_version.stdout | trim }} installed"
  when:
    - installed_salt_version.stdout | trim != salt_version
    - post_install_version is defined
