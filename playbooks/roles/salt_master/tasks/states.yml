---
# tasks/states.yml — sync salt states from kri repo to mm1

- name: Create states directory
  file:
    path: "{{ salt_states_dir }}"
    state: directory
    owner: root
    group: "{{ 'wheel' if ansible_system == 'Darwin' else 'root' }}"
    mode: "0755"
  become: true

- name: Sync salt states from kri repo
  # Recursively copies salt/states/ from the controller (kri worker container)
  # to the master's states dir. Uses the copy module (not synchronize/rsync) —
  # the worker image has no rsync binary. copy over SSH needs no remote rsync.
  copy:
    src: "{{ playbook_dir }}/../salt/states/"
    dest: "{{ salt_states_dir }}/"
    owner: root
    group: "{{ 'wheel' if ansible_system == 'Darwin' else 'root' }}"
    mode: "0644"
  become: true
