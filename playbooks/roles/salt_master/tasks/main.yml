---
# playbooks/roles/salt_master/tasks/main.yml

- name: Gather facts for OS detection (callers may run with gather_facts:false)
  setup:
    gather_subset:
      - '!all'
      - '!min'
      - distribution
      - platform
  when: ansible_system is not defined or ansible_os_family is not defined

- name: Determine OS family for salt install
  set_fact:
    _salt_os: >-
      {{ 'macos' if ansible_system == 'Darwin'
      else 'debian' if ansible_os_family == 'Debian'
      else 'redhat' if ansible_os_family == 'RedHat'
      else 'unsupported' }}

- name: Fail clearly on unsupported OS
  fail:
    msg: >
      salt-master install is not supported on {{ ansible_system }}
      / {{ ansible_os_family | default('unknown') }}.
      Supported: macOS, Debian/Ubuntu, RHEL/Rocky/Alma.
  when: _salt_os == 'unsupported'

- name: Detect CPU architecture (macOS only — needed for .pkg arch)
  shell: uname -m
  args:
    executable: "{{ ansible_shell_executable | default('/bin/bash') }}"
  register: uname_result
  changed_when: false
  when: _salt_os == 'macos'

- name: Set arch facts (macOS only)
  set_fact:
    cpu_arch: "{{ 'arm64' if 'arm64' in uname_result.stdout else 'x86_64' }}"
    brew_prefix: "{{ '/opt/homebrew' if 'arm64' in uname_result.stdout else '/usr/local' }}"
  when: _salt_os == 'macos'

# macOS has a read-only root volume (Catalina+), so /srv cannot be created.
# Use a writable base (/etc/salt/srv) on macOS; keep the standard /srv on Linux.
# All pillar/state tasks AND the master config template derive from these vars,
# so overriding them here propagates everywhere consistently.
- name: Use writable salt data dirs on macOS (read-only root volume)
  set_fact:
    salt_states_dir: /etc/salt/srv/states
    salt_pillar_dir: /etc/salt/srv/pillar
  when: _salt_os == 'macos'

- name: Install salt-master (per OS family)
  include_tasks: "install_{{ _salt_os }}.yml"

- import_tasks: configure.yml
- import_tasks: pki.yml
- import_tasks: pillar.yml
- import_tasks: states.yml
- import_tasks: api_user.yml

- name: Configure service (macOS launchctl)
  include_tasks: service_macos.yml
  when: _salt_os == 'macos'

- name: Configure service (Linux systemd)
  include_tasks: service_systemd.yml
  when: _salt_os != 'macos'
