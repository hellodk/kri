---
# playbooks/roles/salt_master/defaults/main.yml

# Salt version — must match the minion version installed by bootstrap_mac_mini.yml
salt_version: "3007.14"

# Download source: Artifactory mirror first, falls back to official URL
artifactory_binary_url: "http://10.105.205.92:8082/artifactory/example-repo-local/salt"
salt_pkg_official_base: "https://packages.broadcom.com/artifactory/saltproject-generic/onedir/{{ salt_version }}"

# Directories on the salt-master host.
# Everything lives under /etc/salt — consistent across macOS and Linux, and
# avoids /srv which is read-only on macOS (Catalina+ root volume).
salt_pki_dir: /etc/salt/pki/master
salt_states_dir: /etc/salt/states
salt_pillar_dir: /etc/salt/pillar
salt_log_dir: /var/log/salt

# salt-api HTTP port (used by kri API/worker for ad-hoc commands)
salt_api_port: 8080

# User created for kri to authenticate with salt-api (PAM auth)
# Password is set via variable kri_salt_api_password (pass via vault or -e)
salt_api_user: "krisalt"
kri_salt_api_password: "changeme-set-in-vault"

# salt-api TLS certificate and private key paths.
# The api_tls.yml task generates a self-signed cert/key at these paths if absent.
# kri must connect to salt-api via https://<addr>:<port> — update salt_masters.api_url
# in the kri Masters UI accordingly (e.g. https://192.168.1.x:8080).
# Do NOT commit generated cert/key files — they live only on the master host.
salt_api_ssl_crt: /etc/salt/pki/api/salt-api.crt
salt_api_ssl_key: /etc/salt/pki/api/salt-api.key

# Variable descriptions shown in kri Automation Hub run modal
_kri_var_descriptions:
  kri_salt_api_password: "Password for the krisalt system user. Grants kri API/worker access to salt-api on this host. Must match SALT_API_PASSWORD in .env.docker."
  salt_api_user: "Username for salt-api PAM authentication (default: krisalt). Change only if you need a custom service account name."
  salt_version: "Salt version to install. Must match the version already running on fleet minions — mismatches cause auth failures."
  artifactory_binary_url: "Base URL for your Artifactory generic repo containing salt installer binaries. Leave blank to use the local bundle or official URL."
  salt_master_interface: "Network interface salt-master listens on. 0.0.0.0 binds to all interfaces including LAN. Restrict to a specific IP for tighter network isolation."
  salt_api_ssl_crt: "Path to the TLS certificate for salt-api (rest_cherrypy). Generated by api_tls.yml if absent. Update api_url in the kri Masters UI to https://."
  salt_api_ssl_key: "Path to the TLS private key for salt-api. Generated by api_tls.yml if absent. Never committed to git."

# Salt-master listen address (0.0.0.0 = all interfaces incl LAN)
salt_master_interface: "0.0.0.0"

# Presence events — used by kri to detect minion connect/disconnect
salt_presence_events: true
salt_loop_interval: 60
