---
# playbooks/roles/salt_master/defaults/main.yml

# Salt version — must match the minion version installed by bootstrap_node.yml
salt_version: "3007.14"

# Download source: Artifactory mirror first, falls back to official URL.
# Blank by default (matches group_vars/all.yml) — set per-host in host_vars or via
# -e; never hardcode an internal IP here (#1006 hygiene).
artifactory_binary_url: ""
salt_pkg_official_base: "https://packages.broadcom.com/artifactory/saltproject-generic/onedir/{{ salt_version }}"

# Linux salt package repos — override to point at an air-gapped Artifactory mirror
salt_deb_repo_url: "https://packages.broadcom.com/artifactory/saltproject-deb/"
salt_deb_gpg_url: "https://packages.broadcom.com/artifactory/api/security/keypair/SaltProjectKey/public"
salt_rpm_repo_baseurl: "https://packages.broadcom.com/artifactory/saltproject-rpm/"
salt_rpm_gpg_url: "https://packages.broadcom.com/artifactory/api/security/keypair/SaltProjectKey/public"

# ── Linux onedir air-gapped install (#696) ────────────────────────────────────
#
# When salt_linux_airgap=true the role skips the apt/yum repo path and instead
# installs from a self-contained onedir tarball (analogous to the macOS .pkg).
# Set this to true when the target Linux host has no internet access.
#
# LIVE-ENVIRONMENT VALIDATION NEEDED before first production use:
#   1. Download the tarball from packages.broadcom.com and verify its SHA-512.
#   2. Confirm /opt/saltstack/salt/bin/ layout matches the version you deploy.
#   3. Test service startup (salt-master, salt-api) with the generated systemd unit.
#   4. Verify salt-key, salt-run, and salt-call symlinks work after install.
#
salt_linux_airgap: false

# Architecture tag used to construct the tarball filename.
# Common values: "x86_64" (amd64), "aarch64" (arm64).
# Override with -e salt_linux_arch=aarch64 for ARM targets.
salt_linux_arch: "x86_64"

# Tarball filename — assembled from version and arch.
# Format: salt-<version>-onedir-linux-<arch>.tar.xz
# Source: https://packages.broadcom.com/artifactory/saltproject-generic/onedir/<version>/
salt_linux_tarball_name: "salt-{{ salt_version }}-onedir-linux-{{ salt_linux_arch }}.tar.xz"

# Official base URL for Linux onedir tarballs (used as last resort when
# Artifactory mirror and local bundle are both unavailable).
salt_linux_onedir_official_base: "https://packages.broadcom.com/artifactory/saltproject-generic/onedir/{{ salt_version }}"

# Directories on the salt-master host.
# Everything lives under /etc/salt — consistent across macOS and Linux, and
# avoids /srv which is read-only on macOS (Catalina+ root volume).
salt_pki_dir: /etc/salt/pki/master
salt_states_dir: /etc/salt/states
salt_pillar_dir: /etc/salt/pillar
salt_log_dir: /var/log/salt

# salt-api HTTP port (used by kri API/worker for ad-hoc commands)
salt_api_port: 4507

# Open-file (descriptor) limit for the salt-api service. macOS launchd defaults
# to a 256 soft limit, which salt-api's cheroot server exhausts under TLS
# connection churn -> [Errno 24] Too many open files -> HTTP 500 on /login,/run.
# Applied via SoftResourceLimits/HardResourceLimits in the launchd plist.
salt_api_max_open_files: 10240

# User created for kri to authenticate with salt-api (PAM auth)
# Password is set via variable kri_salt_api_password (pass via vault or -e)
salt_api_user: "krisalt"
kri_salt_api_password: "changeme-set-in-vault"

# salt-api TLS certificate and private key paths.
# The api_tls.yml task generates a self-signed cert/key at these paths if absent.
# kri must connect to salt-api via https://<addr>:<port> — update salt_masters.api_url
# in the kri Masters UI accordingly (e.g. https://192.168.1.x:4507).
# Do NOT commit generated cert/key files — they live only on the master host.
salt_api_ssl_crt: /etc/salt/pki/api/salt-api.crt
salt_api_ssl_key: /etc/salt/pki/api/salt-api.key

# Variable descriptions shown in kri Automation Hub run modal
_kri_var_descriptions:
  kri_salt_api_password: "Password for the krisalt system user. Grants kri API/worker access to salt-api on this host. Must match SALT_API_PASSWORD in .env.docker."
  salt_api_user: "Username for salt-api PAM authentication (default: krisalt). Change only if you need a custom service account name."
  salt_version: "Salt version to install. Must match the version already running on fleet minions — mismatches cause auth failures."
  artifactory_binary_url: "Base URL for your Artifactory generic repo containing salt installer binaries. Leave blank to use the local bundle or official URL."
  salt_master_interface: "Network interface salt-master listens on. 0.0.0.0 binds to all interfaces including LAN. Restrict to a specific IP for tighter network isolation."
  salt_api_ssl_crt: "Path to the TLS certificate for salt-api (rest_cherrypy). Generated by api_tls.yml if absent. Update api_url in the kri Masters UI to https://."
  salt_api_ssl_key: "Path to the TLS private key for salt-api. Generated by api_tls.yml if absent. Never committed to git."

# Salt-master listen address (0.0.0.0 = all interfaces incl LAN)
salt_master_interface: "0.0.0.0"

# Presence events — used by kri to detect minion connect/disconnect
salt_presence_events: true
salt_loop_interval: 60

# Auto-accept incoming minion keys. Defaults to true to match the kri
# SaltMaster.auto_accept model default and the trusted-LAN homelab policy:
# kri's unattended bootstrap runs `salt-call state.apply` on the minion during
# the playbook, which blocks until the key is accepted. With auto_accept the
# key is accepted the instant the minion connects, so bootstrap converges
# without a manual accept step. Set to false for environments that require
# explicit key approval via the kri Minion Keys UI.
salt_master_auto_accept: true

# Co-locate a salt-minion on the master (#707) so the master is also a managed
# node of itself (appears under its own master in the kri UI, targetable by
# states). Disable with -e salt_master_install_minion=false.
salt_master_install_minion: true
# Address the co-located minion connects to (loopback = the local master).
salt_minion_master_address: "127.0.0.1"
# Minion id for the master's own minion. Defaults to the host's short hostname.
salt_master_minion_id: "{{ ansible_hostname | default(inventory_hostname_short) }}"
# salt-key binary used to accept the co-located minion's key.
# macOS onedir installs under /opt/salt; Linux packages put it on PATH.
salt_key_bin: "{{ '/opt/salt/salt-key' if ansible_system == 'Darwin' else 'salt-key' }}"
