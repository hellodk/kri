---
galaxy_info:
  role_name: kri_enroll
  description: >-
    (Re)enrolls a node with the kri Fleet Platform: verifies salt-minion
    reachability, applies kri's heartbeat/process-report Salt schedules, and
    pushes initial grains to the kri ingest API.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions:
        - all
    - name: Debian
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
    - name: MacOSX
      versions:
        - all

dependencies: []
