---
# playbooks/roles/otel_collector/tasks/install.yml
# Version-gated, AIR-GAPPED install of the otelcol-contrib binary. Shared by Linux
# and macOS — otel_os/otel_arch are set by tasks/main.yml before this is included.
# Mirrors playbooks/roles/node_exporter/tasks/install.yml + salt_minion air-gap
# (#966): the pinned tarball + its .sha256 are bundled under playbooks/files/ and
# COPIED to the target — nothing is downloaded at runtime. The bundled checksum is
# validated against the copied tarball before install.
# Only the darwin/arm64 tarball is bundled today; other os/arch is a follow-up (#696).

- name: Set otelcol-contrib tarball name
  ansible.builtin.set_fact:
    otel_tarball: "otelcol-contrib_{{ otel_collector_version }}_{{ otel_os }}_{{ otel_arch }}.tar.gz"

- name: Check existing otelcol-contrib version
  ansible.builtin.shell: "{{ otel_collector_install_dir }}/otelcol-contrib --version 2>&1 | awk '{print $NF}'"
  register: otel_installed_version
  failed_when: false
  changed_when: false
  become: false

# Copy the bundled tarball + checksum from playbooks/files/ (air-gap; no download).
- name: Copy bundled otelcol-contrib checksum to target
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/{{ otel_tarball }}.sha256"
    dest: "/tmp/{{ otel_tarball }}.sha256"
    mode: "0644"
  become: false
  when: otel_installed_version.stdout.strip() != otel_collector_version

- name: Copy bundled otelcol-contrib tarball to target
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/{{ otel_tarball }}"
    dest: "/tmp/{{ otel_tarball }}"
    mode: "0644"
  become: false
  when: otel_installed_version.stdout.strip() != otel_collector_version

- name: Verify otelcol-contrib tarball checksum
  ansible.builtin.shell: |
    EXPECTED=$(cat /tmp/{{ otel_tarball }}.sha256 | awk '{print $1}')
    if command -v sha256sum >/dev/null 2>&1; then
      ACTUAL=$(sha256sum /tmp/{{ otel_tarball }} | awk '{print $1}')
    else
      ACTUAL=$(shasum -a 256 /tmp/{{ otel_tarball }} | awk '{print $1}')
    fi
    if [ "$EXPECTED" != "$ACTUAL" ]; then
      echo "CHECKSUM MISMATCH: expected $EXPECTED got $ACTUAL" >&2
      exit 1
    fi
    echo "Checksum OK: $ACTUAL"
  changed_when: false
  when: otel_installed_version.stdout.strip() != otel_collector_version

- name: Extract and install otelcol-contrib binary
  ansible.builtin.shell: |
    mkdir -p /tmp/otelcol-contrib-{{ otel_collector_version }}
    tar -xzf /tmp/{{ otel_tarball }} -C /tmp/otelcol-contrib-{{ otel_collector_version }}
    cp /tmp/otelcol-contrib-{{ otel_collector_version }}/otelcol-contrib {{ otel_collector_install_dir }}/otelcol-contrib
    chmod 0755 {{ otel_collector_install_dir }}/otelcol-contrib
  become: true
  when: otel_installed_version.stdout.strip() != otel_collector_version
