---
# playbooks/deploy_salt_master_mm1.yml
# Install salt-master + salt-api on mm1 (native, no Docker dependency).
#
# Usage:
#   ansible-playbook playbooks/deploy_salt_master_mm1.yml \
#     -i playbooks/inventory/hosts.ini \
#     -e "kri_salt_api_password=<secure-password>"
#
# After running:
#   1. Update .env.docker: SALT_API_URL=https://100.102.68.75:4507
#   2. Restart kri: docker compose -f deploy/docker-compose.yml up -d
#   3. Minion configs already set salt_master_address=100.102.68.75

- name: Deploy salt-master (native install)
  hosts: all  # kri sets targets via inventory; use all to run on selected nodes
  gather_facts: false
  become: true  # all install/config/service ops need root on the target;
                # also elevates localhost-delegated tasks (PKI key read) on the controller
  vars:
    # Override on CLI: -e kri_salt_api_password=<password>
    kri_salt_api_password: "changeme-set-via-e-flag"
    _kri_var_descriptions:
      kri_salt_api_password: "Password for the krisalt system user created on the target. Used by kri workers to authenticate with salt-api. Use a strong password — it grants full fleet control via Salt."

  pre_tasks:
    - name: Confirm target host
      debug:
        msg: "Deploying salt-master to {{ inventory_hostname }} ({{ ansible_host }})"

  roles:
    - salt_master

  post_tasks:
    - name: Print post-install instructions
      debug:
        msg: |
          ============================================================
          Salt-master installed on mm1 ({{ ansible_host }}).

          Update deploy/.env.docker:
            SALT_API_URL=http://{{ ansible_host }}:{{ salt_api_port }}
            SALT_API_USER={{ salt_api_user }}
            SALT_API_PASSWORD={{ kri_salt_api_password }}

          Then restart kri workers:
            cd deploy && docker compose -f docker-compose.yml up -d api worker beat

          Minion salt_master_address is already set to 100.102.68.75 via
          playbooks/group_vars/all.yml. Re-run bootstrap_node.yml on
          any node that hasn't connected yet.
          ============================================================
