---
# playbooks/install_salt_master_linux.yml
#
# Install salt-master natively on a Linux host (Debian/Ubuntu or RHEL/CentOS).
# Installs via the official SaltProject apt/yum repository — requires internet
# access on the target host (or a local mirror).
#
# ─── Usage ───────────────────────────────────────────────────────────────────
#
#   # Interactive (kri will prompt for target and detect OS):
#   kri saltmaster install
#
#   # Direct:
#   ansible-playbook playbooks/install_salt_master_linux.yml \
#     -i <target-ip>, \
#     -e "target_host=<target-ip>" \
#     -e "ansible_user=dk" \
#     -e "kri_salt_api_password=<secure-password>"
#
# ─── Variables ───────────────────────────────────────────────────────────────
#
#   target_host           (required) IP or hostname of the target Linux host
#   ansible_user          SSH username on the target (default: dk)
#   kri_salt_api_password Password for the krisalt PAM user (default: changeme)
#   kri_ingest_base_url   kri API base URL for minion heartbeats
#
# ─── After running ───────────────────────────────────────────────────────────
#
#   1. Open the kri UI → Settings → Salt Masters and add the new master:
#        URL:      https://<target_host>:4507
#        User:     krisalt
#        Password: <kri_salt_api_password>
#
#   2. Update minion configs on all fleet nodes (or re-run bootstrap):
#        /etc/salt/minion → master: <target_host>
#
#   3. Accept minion keys once they reconnect:
#        kri saltmaster keys
#
# ─────────────────────────────────────────────────────────────────────────────

- name: Pre-flight — validate target host is defined
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Fail if target_host not provided
      fail:
        msg: |
          target_host is required.
          Run:  ansible-playbook playbooks/install_salt_master_linux.yml -e target_host=<IP>
          Or:   kri saltmaster install
      when: target_host is not defined or target_host == ''

    - name: Check if Linux onedir bundle is present (air-gapped mode only)
      stat:
        path: "{{ playbook_dir }}/files/salt-{{ salt_version | default('3007.14') }}-onedir-linux-{{ salt_linux_arch | default('x86_64') }}.tar.gz"
      register: linux_bundle_check
      when: salt_linux_airgap | default(false) | bool

    - name: Warn if air-gapped mode requested but onedir bundle is missing
      debug:
        msg: |
          WARNING: salt_linux_airgap=true but the Linux onedir tarball was not found at:
            {{ playbook_dir }}/files/salt-{{ salt_version | default('3007.14') }}-onedir-linux-{{ salt_linux_arch | default('x86_64') }}.tar.gz

          The playbook will attempt Artifactory first, then fall back to downloading from:
            https://packages.broadcom.com/artifactory/saltproject-generic/onedir/{{ salt_version | default('3007.14') }}/

          For a true air-gapped install, place the tarball (and optional .sha512 file) at the
          path above on the kri controller before running the playbook.

          To download the bundle on a connected machine:
            ARCH=x86_64  # or aarch64 for ARM
            VER=3007.14
            curl -LO https://packages.broadcom.com/artifactory/saltproject-generic/onedir/${VER}/salt-${VER}-onedir-linux-${ARCH}.tar.gz
            curl -LO https://packages.broadcom.com/artifactory/saltproject-generic/onedir/${VER}/salt-${VER}-onedir-linux-${ARCH}.tar.gz.sha512
          Then copy both files to:
            playbooks/files/
      when:
        - salt_linux_airgap | default(false) | bool
        - linux_bundle_check is defined
        - not linux_bundle_check.stat.exists


- name: Install and configure salt-master on Linux
  hosts: "{{ target_host }}"
  gather_facts: true
  become: true

  vars:
    ansible_user: "{{ ansible_user | default('dk') }}"
    ansible_become_method: sudo
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o ConnectTimeout=15
      -o ServerAliveInterval=30
      -o ServerAliveCountMax=6

    # Salt-master listens on all interfaces — Tailscale overlay provides the security layer
    salt_master_interface: "0.0.0.0"

    # kri ingest URL: the kri API container's Tailscale IP
    # Override with -e kri_ingest_base_url=http://<kri-server>/api/v1/ingest
    kri_ingest_base_url: "http://100.89.50.27/api/v1/ingest"

  roles:
    - salt_master

  post_tasks:
    - name: Verify salt-master service is active
      shell: systemctl is-active salt-master || true
      register: salt_master_active
      changed_when: false

    - name: Print next steps
      debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════╗
          ║  salt-master installed on {{ target_host }} (Linux)
          ╠══════════════════════════════════════════════════════════════╣
          ║
          ║  1. Add this master in the kri UI:
          ║       Settings → Salt Masters → Add
          ║         URL:      https://{{ target_host }}:{{ salt_api_port | default(4507) }}
          ║         User:     {{ salt_api_user | default('krisalt') }}
          ║         Password: <kri_salt_api_password>
          ║
          ║  2. Update minion configs on ALL fleet nodes to point here:
          ║       /etc/salt/minion → master: {{ target_host }}
          ║     OR re-bootstrap each node (will pick up SALT_MASTER_ADDRESS).
          ║
          ║  3. Accept minion keys after they reconnect:
          ║       kri saltmaster keys     (accept via kri UI)
          ║
          ╚══════════════════════════════════════════════════════════════╝
