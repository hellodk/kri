# kri-managed Ansible configuration (#353). The worker points ANSIBLE_CONFIG here;
# operators running ansible-playbook manually from playbooks/ get identical behaviour.

[defaults]
host_key_checking    = False
timeout              = 10
task_timeout         = 300
retry_files_enabled  = False
forks                = 20
interpreter_python   = auto_silent
deprecation_warnings = False

[ssh_connection]
ssh_args   = -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ControlMaster=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4
pipelining = True
retries    = 2
